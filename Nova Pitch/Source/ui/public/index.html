<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova Pitch</title>
<style>
  :root {
    --bg: #0a0a10;
    --panel: #111117;
    --panel-2: #15151d;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.16);
    --text: #f3f3f8;
    --text-dim: #83838f;
    --text-dimmer: #55555f;
    --purple: #9c7dff;
    --purple-strong: #b79bff;
    --purple-glow: rgba(156,125,255,0.45);
    --blue: #4ea9ff;
    --blue-glow: rgba(78,169,255,0.4);
    --track: rgba(255,255,255,0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }

  /* Fixed design canvas, uniformly scaled to fit the actual window size -
     same technique as Nova Tape's #stage (see that project's index.html
     for the full rationale: JS-computed scale, not CSS min()/calc(),
     since some embedded WebViews silently drop that nested-function
     syntax; polled, not just resize-event-driven, since this WebView
     doesn't reliably fire resize events on a native host setBounds()).
     This keeps every element's relative proportions identical at any
     window size, rather than letting the grid reflow unpredictably. */
  #stageOuter { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage { width: 1100px; height: 660px; flex: 0 0 auto; position: relative; transform-origin: center center; }

  .plugin {
    width: 100%; height: 100%;
    display: grid;
    grid-template-rows: 66px 52px 1fr 128px 34px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, rgba(90,60,180,0.08), transparent 70%),
      linear-gradient(180deg, #0c0c13 0%, #08080c 100%);
    position: relative;
  }

  /* ── Header ─────────────────────────────────────────── */
  .header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-title { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  .brand-title .w { color: var(--text); }
  .brand-title .p { color: var(--purple); text-shadow: 0 0 18px var(--purple-glow); }
  .brand-sub { font-size: 10px; letter-spacing: 2.2px; color: var(--text-dim); text-transform: uppercase; }

  .brandRight { justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .brandRight-nova {
    font-size: 22px; font-weight: 800; letter-spacing: 3px;
    color: #b8bac3; line-height: 1;
  }
  .brandRight-audio {
    font-size: 10px; font-weight: 600; letter-spacing: 5px;
    color: var(--purple-strong); line-height: 1;
    margin-left: 5px;
  }

  .presetBar { display: flex; align-items: center; gap: 10px; }
  .presetNavBtn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 14px;
    display: grid; place-items: center; transition: all 120ms ease;
  }
  .presetNavBtn:hover { color: var(--text); border-color: var(--purple); }
  .presetNameWrap {
    min-width: 168px; height: 30px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--border-strong); background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; letter-spacing: 0.3px; color: var(--purple-strong);
    position: relative;
  }
  .abGroup { display: flex; gap: 3px; margin-left: 6px; }
  .abBtn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 12px; font-weight: 700;
    transition: all 120ms ease;
  }
  .abBtn.is-active { background: var(--purple); border-color: var(--purple); color: #0a0a10; box-shadow: 0 0 14px var(--purple-glow); }
  .pillBtn {
    height: 28px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 11px; font-weight: 600; letter-spacing: 1px;
    transition: all 120ms ease;
  }
  .pillBtn:hover { color: var(--text); border-color: var(--purple); }
  .iconBtn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 13px;
    display: grid; place-items: center; transition: all 120ms ease;
  }
  .iconBtn:hover { color: var(--text); border-color: var(--purple); }

  /* Save popover */
  .savePopover {
    position: absolute; top: 36px; left: 50%; transform: translateX(-50%) translateY(-6px);
    width: 240px; padding: 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: #16161f; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 8px; z-index: 40;
    opacity: 0; transition: opacity 140ms ease, transform 140ms ease;
  }
  .savePopover.is-open { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  .savePopover label { font-size: 10px; letter-spacing: 1.2px; color: var(--text-dim); text-transform: uppercase; }
  .savePopover input {
    height: 30px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--panel);
    color: var(--text); font: inherit; font-size: 13px; padding: 0 10px; outline: none;
  }
  .savePopover input:focus { border-color: var(--purple); }
  .savePopoverRow { display: flex; gap: 8px; justify-content: flex-end; }
  .savePopoverRow button {
    height: 26px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-strong);
    background: var(--panel); color: var(--text-dim); font-size: 11px;
  }
  .savePopoverRow button.confirm { background: var(--purple); border-color: var(--purple); color: #0a0a10; font-weight: 600; }

  /* ── Top strip ──────────────────────────────────────── */
  .topStrip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; border-bottom: 1px solid var(--border);
  }
  .stepGroup { display: flex; align-items: center; gap: 10px; }
  .stepControl { position: relative; display: flex; flex-direction: column; gap: 3px; }
  .stepControl label { font-size: 9px; letter-spacing: 1.4px; color: var(--text-dimmer); text-transform: uppercase; }
  .stepPopover {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 120px;
    max-height: 240px; overflow-y: auto;
    padding: 6px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: #16161f; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 2px; z-index: 50;
  }
  .stepPopover.is-open { display: flex; }
  .stepPopoverItem {
    padding: 6px 10px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-dim); font-size: 12px; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .stepPopoverItem:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .stepPopoverItem.is-selected { color: var(--purple-strong); font-weight: 600; }
  .stepBtn {
    height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text); font-size: 12px; letter-spacing: 0.4px;
    display: flex; align-items: center; gap: 8px; min-width: 78px; justify-content: space-between;
    transition: border-color 120ms ease;
  }
  .stepBtn:hover { border-color: var(--purple); }
  .stepBtn .chev { color: var(--text-dim); font-size: 11px; }
  .viewBtn { color: var(--text-dim); cursor: default; }
  .powerBtn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--text-dim); font-size: 13px;
    display: grid; place-items: center; transition: all 140ms ease;
  }
  .powerBtn.is-active { color: var(--purple-strong); border-color: var(--purple); box-shadow: 0 0 12px var(--purple-glow); }

  /* ── Hero row ───────────────────────────────────────── */
  .heroRow {
    position: relative; z-index: 0;
    display: grid; grid-template-columns: 200px 1fr 200px;
    align-items: center; justify-items: center;
    padding: 0 20px;
    min-height: 0;
  }
  .heroWing {
    position: absolute; z-index: -1;
    top: 12px; bottom: 12px; width: 400px;
    background: linear-gradient(180deg, rgba(255,255,255,0.028), rgba(255,255,255,0.006) 50%, transparent 82%);
    border: 1px solid rgba(255,255,255,0.055);
  }
  .heroWingLeft { left: 8px; border-radius: 28px 170px 170px 28px; }
  .heroWingRight { right: 8px; border-radius: 170px 28px 28px 170px; }

  .knobColumn { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .knobColumnLabel { font-size: 12px; letter-spacing: 1.4px; color: var(--text-dim); text-transform: uppercase; }

  .knob { position: relative; display: grid; place-items: center; }
  .knob.big { width: 132px; height: 132px; }
  .knob.small { width: 70px; height: 70px; }
  .knobRingBg, .knobRingFill {
    position: absolute; inset: 0; border-radius: 50%;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
  }
  .knob.small .knobRingBg, .knob.small .knobRingFill {
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  }
  .knobRingBg {
    background: conic-gradient(from -135deg, var(--track) 0deg, var(--track) 270deg, transparent 270deg, transparent 360deg);
  }
  .knobRingFill {
    background: conic-gradient(from -135deg, var(--purple) calc(var(--pct, 0) * 270deg), transparent calc(var(--pct, 0) * 270deg));
    filter: drop-shadow(0 0 6px var(--purple-glow));
  }
  .knob.bipolar .knobRingFill {
    background: conic-gradient(from -135deg,
      transparent 0deg, transparent calc(var(--zeroPct, 0.5) * 270deg - 0.1deg),
      var(--purple) calc(var(--zeroPct, 0.5) * 270deg - 0.1deg), var(--purple) calc(var(--zeroPct, 0.5) * 270deg + 0.1deg),
      transparent calc(var(--zeroPct, 0.5) * 270deg + 0.1deg));
  }
  .knob.bipolar.pos .knobRingFill {
    background: conic-gradient(from -135deg,
      transparent 0deg, transparent calc(var(--zeroPct, 0.5) * 270deg),
      var(--purple) calc(var(--zeroPct, 0.5) * 270deg), var(--purple) calc(var(--pct, 0.5) * 270deg),
      transparent calc(var(--pct, 0.5) * 270deg));
  }
  .knob.bipolar.neg .knobRingFill {
    background: conic-gradient(from -135deg,
      transparent 0deg, transparent calc(var(--pct, 0.5) * 270deg),
      var(--purple) calc(var(--pct, 0.5) * 270deg), var(--purple) calc(var(--zeroPct, 0.5) * 270deg),
      transparent calc(var(--zeroPct, 0.5) * 270deg));
  }
  .knobCap {
    position: absolute; inset: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2c2c38, #17171f 68%, #101015);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.06), inset 0 -6px 10px rgba(0,0,0,0.5), 0 3px 8px rgba(0,0,0,0.4);
  }
  .knob.small .knobCap { inset: 5px; }
  .knobPointer {
    position: absolute; left: 50%; top: 8%; width: 2px; height: 32%;
    background: #f3f3f8; border-radius: 2px; transform-origin: 50% 190%;
    box-shadow: 0 0 4px rgba(255,255,255,0.5);
  }
  .knob.small .knobPointer { top: 10%; height: 30%; width: 2px; }
  .knobRangeLabels {
    width: 100%; display: flex; justify-content: space-between;
    font-size: 9px; letter-spacing: 0.6px; color: var(--text-dimmer); text-transform: uppercase;
  }
  .knobValue { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .knob.small ~ .knobValue, .miniValue { font-size: 12px; }

  /* ── Hero circle ────────────────────────────────────── */
  .heroCircle { position: relative; width: 300px; height: 300px; display: grid; place-items: center; }
  .heroRing { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-135deg); }
  .heroRingTrack, .heroRingFillPath {
    fill: none; stroke-width: 3; stroke-linecap: round;
  }
  .heroRingTrack { stroke: var(--track); }
  .heroRingFillPath {
    stroke: url(#heroGradient);
    filter: drop-shadow(0 0 8px var(--purple-glow));
  }
  .heroInner {
    position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #15151f, #0b0b10 70%);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 18px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }
  .heroLabel { font-size: 10px; letter-spacing: 2.4px; color: var(--text-dimmer); text-transform: uppercase; margin-bottom: 2px; }
  .heroNote { font-size: 46px; font-weight: 700; line-height: 1; display: flex; align-items: flex-end; gap: 2px; color: var(--text); text-shadow: 0 0 22px var(--purple-glow); }
  .heroOctave { font-size: 20px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; }
  .heroWave { width: 100%; max-width: 210px; height: 46px; margin: 6px 0 2px; display: block; }
  .heroCentsRow { width: 100%; max-width: 210px; display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dimmer); margin-bottom: 2px; }
  .heroCents { font-size: 20px; font-weight: 700; color: var(--purple-strong); font-variant-numeric: tabular-nums; }
  .heroCentsLabel { font-size: 9px; letter-spacing: 1.8px; color: var(--text-dimmer); text-transform: uppercase; }
  .heroCents.in-tune { color: #6ee7a8; }

  /* ── Bottom strip ───────────────────────────────────── */
  .bottomStrip {
    display: grid; grid-template-columns: repeat(5, 1fr);
    align-items: center; gap: 6px;
    padding: 10px 22px; border-top: 1px solid var(--border);
  }
  .miniKnobCol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .miniLabel { font-size: 10px; letter-spacing: 1.1px; color: var(--text-dim); text-transform: uppercase; margin-top: 1px; }

  /* ── Footer ─────────────────────────────────────────── */
  .footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 22px; position: relative; }
  .footerLine { flex: 1; max-width: 220px; height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); }
  .footerText { font-size: 10px; letter-spacing: 3px; color: var(--text-dimmer); white-space: nowrap; }
  .settingsBtn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-dimmer); font-size: 13px; display: grid; place-items: center;
    transition: color 120ms ease;
  }
  .settingsBtn:hover { color: var(--text-dim); }

  /* ── Settings popover ───────────────────────────────── */
  .settingsPopover {
    position: absolute; right: 14px; bottom: 40px;
    width: 200px; padding: 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: #16161f; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 10px; z-index: 40;
  }
  .settingsPopover.is-open { display: flex; }
  .settingsRow { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-dim); }
  .settingsRow .val { color: var(--text); }
  .settingsVersion { font-size: 9px; color: var(--text-dimmer); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
</style>
</head>
<body>
  <div id="stageOuter">
  <div id="stage">
  <main class="plugin">
    <header class="header">
      <div class="brand">
        <div class="brand-title"><span class="w">NOVA</span> <span class="p">PITCH</span></div>
        <div class="brand-sub">Real-Time Pitch Correction</div>
      </div>

      <div class="presetBar" style="position:relative;">
        <button class="presetNavBtn" id="presetPrev" aria-label="Previous preset">‹</button>
        <div class="presetNameWrap"><span id="presetName">Modern Vocal</span></div>
        <button class="presetNavBtn" id="presetNext" aria-label="Next preset">›</button>
        <div class="abGroup">
          <button class="abBtn is-active" id="abBtnA">A</button>
          <button class="abBtn" id="abBtnB">B</button>
        </div>
        <button class="pillBtn" id="saveBtn">SAVE</button>
        <button class="iconBtn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="savePopover" id="savePopover">
          <label for="saveNameInput">Preset name</label>
          <input id="saveNameInput" type="text" maxlength="40" placeholder="My Vocal Chain" autocomplete="off" spellcheck="false">
          <div class="savePopoverRow">
            <button id="saveCancel" type="button">Cancel</button>
            <button id="saveConfirm" class="confirm" type="button">Save</button>
          </div>
        </div>
      </div>

      <div class="brandRight">
        <div class="brandRight-nova">NOVA</div>
        <div class="brandRight-audio">AUDIO</div>
      </div>
    </header>

    <section class="topStrip">
      <div class="stepGroup">
        <div class="stepControl">
          <label>Key</label>
          <button class="stepBtn" id="keyBtn"><span id="keyValue">C</span><span class="chev">›</span></button>
        </div>
        <div class="stepControl">
          <label>Scale</label>
          <button class="stepBtn" id="scaleBtn"><span id="scaleValue">Major</span><span class="chev">›</span></button>
        </div>
      </div>
      <div class="stepGroup">
        <div class="stepControl">
          <label>View</label>
          <button class="stepBtn viewBtn" id="viewBtn">Waveform</button>
        </div>
        <div class="stepControl">
          <label>Bypass</label>
          <button class="powerBtn" id="bypassBtn" aria-pressed="false" aria-label="Bypass">⏻</button>
        </div>
      </div>
    </section>

    <section class="heroRow">
      <div class="heroWing heroWingLeft"></div>
      <div class="heroWing heroWingRight"></div>
      <div class="knobColumn">
        <div class="knobColumnLabel">Retune Speed</div>
        <div class="knob big" id="retuneKnob" data-param="tolerance" data-min="0" data-max="100" data-invert="1">
          <div class="knobRingBg"></div>
          <div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="knobRangeLabels" style="width:132px;"><span>Slow</span><span>Fast</span></div>
        <div class="knobValue" id="retuneValue">30</div>
      </div>

      <div class="heroCircle">
        <svg class="heroRing" viewBox="0 0 300 300">
          <defs>
            <linearGradient id="heroGradient" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#b78dff" />
              <stop offset="100%" stop-color="#7cd1ff" />
            </linearGradient>
          </defs>
          <circle class="heroRingTrack" cx="150" cy="150" r="138" stroke-dasharray="722.5 867.1" stroke-dashoffset="180.6" />
          <circle class="heroRingFillPath" id="heroRingFillPath" cx="150" cy="150" r="138" stroke-dasharray="722.5 867.1" stroke-dashoffset="180.6" />
        </svg>
        <div class="heroInner">
          <div class="heroLabel">Pitch</div>
          <div class="heroNote"><span id="heroNoteName">--</span><span class="heroOctave" id="heroOctave"></span></div>
          <canvas id="waveCanvas" class="heroWave" width="420" height="92"></canvas>
          <div class="heroCentsRow"><span>-50</span><span>+50</span></div>
          <div class="heroCents" id="heroCents">0</div>
          <div class="heroCentsLabel">Cents</div>
        </div>
      </div>

      <div class="knobColumn">
        <div class="knobColumnLabel">Humanize</div>
        <div class="knob big" id="humanizeKnob" data-param="amount" data-min="0" data-max="100">
          <div class="knobRingBg"></div>
          <div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="knobRangeLabels" style="width:132px;"><span>Subtle</span><span>Extreme</span></div>
        <div class="knobValue" id="humanizeValue">0</div>
      </div>
    </section>

    <section class="bottomStrip">
      <div class="miniKnobCol">
        <div class="knob small" id="vibratoKnob" data-param="vibrato" data-min="0" data-max="100">
          <div class="knobRingBg"></div><div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="miniValue" id="vibratoValue">0</div>
        <div class="miniLabel">Natural Vibrato</div>
      </div>

      <div class="miniKnobCol">
        <div class="knob small" id="vibratoRateKnob" data-param="vibratoRate" data-min="2" data-max="8">
          <div class="knobRingBg"></div><div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="miniValue" id="vibratoRateValue">5.0 Hz</div>
        <div class="miniLabel">Vibrato Rate</div>
      </div>

      <div class="miniKnobCol">
        <div class="knob small bipolar" id="formantKnob" data-param="formantWarp" data-min="-100" data-max="100" data-bipolar="1">
          <div class="knobRingBg"></div><div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="miniValue" id="formantValue">0</div>
        <div class="miniLabel">Formant</div>
      </div>

      <div class="miniKnobCol">
        <div class="knob small" id="transientsKnob" data-param="transients" data-min="0" data-max="100">
          <div class="knobRingBg"></div><div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="miniValue" id="transientsValue">30</div>
        <div class="miniLabel">Transients</div>
      </div>

      <div class="miniKnobCol">
        <div class="knob small bipolar" id="outputKnob" data-param="outputGain" data-min="-24" data-max="24" data-bipolar="1">
          <div class="knobRingBg"></div><div class="knobRingFill"></div>
          <div class="knobCap"><div class="knobPointer"></div></div>
        </div>
        <div class="miniValue" id="outputValue">0.0 dB</div>
        <div class="miniLabel">Output</div>
      </div>
    </section>

    <footer class="footer">
      <div class="footerLine"></div>
      <div class="footerText">Perfect Pitch. Natural Sound.</div>
      <div class="footerLine"></div>
      <button class="settingsBtn" id="settingsBtn" aria-label="Settings">⚙</button>
      <div class="settingsPopover" id="settingsPopover">
        <div class="settingsRow"><span>Quality</span><span class="val" id="settingsLatencyMode">Standard</span></div>
        <div class="settingsRow"><span>Latency</span><span class="val" id="settingsLatencyValue">-- ms</span></div>
        <div class="settingsVersion">Nova Pitch v0.1</div>
      </div>
    </footer>
  </main>
  </div>
  </div>

  <script>
    // The page's own URL is cache-busted with a fresh ?v=timestamp on every
    // editor construction (see PluginEditor.cpp), but a plain <script src>
    // tag doesn't inherit that - it's just a fixed path the WebView can
    // (and did, measured directly) keep serving from its own resource
    // cache across rebuilds. Injecting the tag with the same query string
    // appended closes that gap.
    const s = document.createElement("script");
    s.type = "module";
    s.src = "js/index.js" + window.location.search;
    document.body.appendChild(s);
  </script>
