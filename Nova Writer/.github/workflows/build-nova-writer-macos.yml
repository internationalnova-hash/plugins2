name: Build Nova Writer (macOS)

on:
  push:
    paths:
      - 'Nova Writer/**'
      - '.github/workflows/build-nova-writer-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Nova Writer/package-lock.json'

      - name: Install dependencies
        working-directory: Nova Writer
        run: npm install

      - name: Build macOS app
        working-directory: Nova Writer
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NovaWriter-macOS-dmg
          path: 'Nova Writer/dist/*.dmg'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NovaWriter-macOS-zip
          path: 'Nova Writer/dist/*.zip'
