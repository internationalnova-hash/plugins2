<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Chord</title>
  <style>
    :root {
      --bg-deep:    #0a0a0f;
      --bg-panel:   rgba(12, 11, 22, 0.94);
      --bg-card:    rgba(16, 14, 32, 0.88);
      --purple:     #6c63ff;
      --purple-mid: #8b5cf6;
      --purple-hi:  #a78bfa;
      --indigo:     #4f46e5;
      --purple-glow: rgba(108, 99, 255, 0.5);
      --border-soft: rgba(139, 92, 246, 0.22);
      --border-active: rgba(139, 92, 246, 0.72);
      --text:       #ede9f8;
      --text-soft:  #a89dc8;
      --text-muted: rgba(200, 188, 230, 0.55);
      --ease:       220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background:
        radial-gradient(1100px 480px at 20% 10%, rgba(76, 55, 148, 0.26), transparent 56%),
        radial-gradient(800px 360px at 80% 85%, rgba(79, 70, 229, 0.18), transparent 50%),
        linear-gradient(180deg, #08080e 0%, #0a0a0f 100%);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── PLUGIN SHELL ── */
    .plugin {
      width: 1100px;
      height: 700px;
      border-radius: 26px;
      border: 1px solid rgba(108, 99, 255, 0.34);
      background:
        radial-gradient(900px 400px at 48% 6%, rgba(68, 52, 128, 0.22), transparent 60%),
        linear-gradient(180deg, rgba(10, 9, 20, 0.99) 0%, rgba(6, 6, 14, 1) 100%);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 0 0 1px rgba(108, 99, 255, 0.12),
        inset 0 -20px 48px rgba(10, 8, 30, 0.44);
      display: grid;
      grid-template-rows: 72px 1fr 44px;
      overflow: hidden;
      position: relative;
    }

    .plugin::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 20px;
      border: 1px solid rgba(167, 139, 250, 0.10);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    .header {
      grid-row: 1;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(108, 99, 255, 0.22);
      background: linear-gradient(180deg, rgba(16, 13, 34, 0.94), rgba(10, 9, 22, 0.90));
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(22, 18, 52, 0.96) 0%, rgba(8, 7, 20, 1) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.22),
        0 0 18px rgba(108, 99, 255, 0.22),
        0 8px 20px rgba(0, 0, 0, 0.36);
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.5));
    }

    .title-stack {
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1;
    }

    .title-nova {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--purple-hi);
      font-weight: 600;
      opacity: 0.82;
    }

    .title-main {
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      color: #f0ecff;
      text-shadow: 0 0 20px rgba(108, 99, 255, 0.38), 0 0 40px rgba(79, 70, 229, 0.20);
    }

    .title-main .chord-word {
      color: var(--purple-hi);
    }

    .header-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .detect-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(108, 99, 255, 0.36);
      background: linear-gradient(180deg, rgba(16, 13, 36, 0.92), rgba(10, 8, 24, 0.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
    }

    .detect-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 8px rgba(108, 99, 255, 0.8);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(108,99,255,0.8); }
      50% { opacity: 0.5; box-shadow: 0 0 4px rgba(108,99,255,0.4); }
    }

    .detect-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 600;
    }

    .key-sig {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(108, 99, 255, 0.28);
      background: rgba(12, 10, 26, 0.88);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-soft);
      cursor: pointer;
      transition: all var(--ease);
    }

    .key-sig:hover {
      border-color: rgba(139, 92, 246, 0.55);
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-self: end;
    }

    .tempo-chip {
      display: flex;
      align-items: baseline;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 10px;
      border: 1px solid rgba(108, 99, 255, 0.28);
      background: rgba(10, 8, 24, 0.88);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--purple-hi);
      text-shadow: 0 0 12px rgba(139, 92, 246, 0.35);
    }

    .tempo-chip .tempo-unit {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text-muted);
    }

    .byline {
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── MAIN BODY ── */
    .body {
      grid-row: 2;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      border-right: 1px solid rgba(108, 99, 255, 0.16);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(11, 10, 24, 0.88), rgba(8, 7, 18, 0.94));
    }

    /* Current chord detected */
    .current-chord-section {
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(108, 99, 255, 0.14);
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label::before {
      content: "";
      display: block;
      width: 3px;
      height: 10px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--purple), var(--indigo));
    }

    .chord-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 12px;
      border-radius: 16px;
      border: 1px solid rgba(108, 99, 255, 0.38);
      background:
        radial-gradient(80% 80% at 50% 30%, rgba(108, 99, 255, 0.12), transparent 65%),
        linear-gradient(180deg, rgba(20, 16, 44, 0.92), rgba(12, 10, 28, 0.96));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 0 24px rgba(108, 99, 255, 0.14),
        inset 0 -12px 22px rgba(0,0,0,0.28);
      position: relative;
      overflow: hidden;
    }

    .chord-hero::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.6), transparent);
    }

    .chord-root {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #f0ecff;
      text-shadow: 0 0 28px rgba(139, 92, 246, 0.55), 0 0 56px rgba(79, 70, 229, 0.28);
    }

    .chord-quality {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--purple-hi);
      font-weight: 600;
    }

    .chord-extensions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ext-pill {
      font-size: 10px;
      letter-spacing: 0.14em;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(139, 92, 246, 0.38);
      color: var(--text-soft);
      background: rgba(20, 16, 40, 0.72);
    }

    .confidence-bar-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .confidence-bar-track {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }

    .confidence-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--indigo), var(--purple), var(--purple-hi));
      box-shadow: 0 0 8px rgba(108, 99, 255, 0.6);
      width: 88%;
      transition: width 0.3s ease;
    }

    .confidence-pct {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      min-width: 28px;
      text-align: right;
    }

    /* Style list (chord variations) */
    .styles-section {
      overflow-y: auto;
      padding: 12px;
    }

    .styles-section::-webkit-scrollbar { width: 3px; }
    .styles-section::-webkit-scrollbar-track { background: transparent; }
    .styles-section::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.28); border-radius: 2px; }

    .style-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all var(--ease);
      background: transparent;
      user-select: none;
    }

    .style-item:hover {
      background: rgba(108, 99, 255, 0.08);
      border-color: rgba(108, 99, 255, 0.22);
    }

    .style-item.active {
      background:
        linear-gradient(135deg, rgba(108, 99, 255, 0.18), rgba(79, 70, 229, 0.10));
      border-color: rgba(139, 92, 246, 0.48);
      box-shadow: 0 0 14px rgba(108, 99, 255, 0.14), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .style-name {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-soft);
      transition: color var(--ease);
    }

    .style-item.active .style-name {
      color: var(--purple-hi);
    }

    .style-notes {
      font-size: 9px;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .style-item.active .style-notes {
      color: rgba(167, 139, 250, 0.7);
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      display: grid;
      grid-template-rows: 42px 1fr 130px;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(108, 99, 255, 0.14);
      background: linear-gradient(180deg, rgba(11, 10, 24, 0.82), rgba(9, 8, 20, 0.88));
    }

    .toolbar-label {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-right: 4px;
    }

    .tool-btn {
      height: 26px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid rgba(108, 99, 255, 0.28);
      background: rgba(12, 10, 26, 0.82);
      color: var(--text-soft);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
      font-family: inherit;
    }

    .tool-btn:hover {
      border-color: rgba(139, 92, 246, 0.52);
      color: var(--text);
      background: rgba(108, 99, 255, 0.12);
    }

    .tool-btn.active {
      border-color: rgba(167, 139, 250, 0.72);
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.24), rgba(79, 70, 229, 0.16));
      color: var(--purple-hi);
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.22), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .toolbar-spacer { flex: 1; }

    .beats-select {
      height: 26px;
      padding: 0 8px;
      border-radius: 7px;
      border: 1px solid rgba(108, 99, 255, 0.28);
      background: rgba(12, 10, 26, 0.82);
      color: var(--text-soft);
      font-size: 10px;
      letter-spacing: 0.10em;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--ease);
    }

    .beats-select:focus {
      border-color: rgba(139, 92, 246, 0.55);
      color: var(--text);
    }

    /* Progression area */
    .progression-area {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 14px 16px;
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .progression-area::-webkit-scrollbar { height: 3px; }
    .progression-area::-webkit-scrollbar-track { background: transparent; }
    .progression-area::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.28); border-radius: 2px; }

    /* Chord card (glass-morphism) */
    .chord-card {
      flex: 0 0 auto;
      width: 110px;
      border-radius: 16px;
      border: 1px solid rgba(108, 99, 255, 0.22);
      background:
        linear-gradient(160deg, rgba(22, 18, 50, 0.88), rgba(12, 10, 28, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--ease);
      position: relative;
      overflow: hidden;
      user-select: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 8px 20px rgba(0,0,0,0.28);
    }

    .chord-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.28), transparent);
    }

    .chord-card:hover {
      border-color: rgba(139, 92, 246, 0.44);
      background:
        radial-gradient(80% 60% at 50% 10%, rgba(108, 99, 255, 0.10), transparent 65%),
        linear-gradient(160deg, rgba(28, 22, 60, 0.90), rgba(16, 13, 36, 0.94));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 0 18px rgba(108, 99, 255, 0.16),
        0 10px 24px rgba(0,0,0,0.32);
      transform: translateY(-2px);
    }

    .chord-card.active {
      border-color: rgba(167, 139, 250, 0.68);
      background:
        radial-gradient(80% 60% at 50% 10%, rgba(108, 99, 255, 0.20), transparent 65%),
        linear-gradient(160deg, rgba(36, 28, 76, 0.92), rgba(20, 16, 48, 0.96));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 0 0 1px rgba(139, 92, 246, 0.32),
        0 0 24px rgba(108, 99, 255, 0.32),
        0 12px 28px rgba(0,0,0,0.38);
      transform: translateY(-3px);
    }

    .chord-card.active::after {
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.62), transparent);
    }

    .card-beat {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      align-self: flex-start;
    }

    .card-active .card-beat { color: rgba(167, 139, 250, 0.6); }

    .card-root {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #f0ecff;
      text-shadow: 0 0 16px rgba(139, 92, 246, 0.40);
    }

    .chord-card.active .card-root {
      text-shadow: 0 0 22px rgba(167, 139, 250, 0.65), 0 0 40px rgba(108, 99, 255, 0.30);
    }

    .card-quality {
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 600;
    }

    .chord-card.active .card-quality { color: var(--purple-hi); }

    .card-ext {
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .chord-card.active .card-ext { color: rgba(167, 139, 250, 0.62); }

    .card-duration {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      width: 100%;
    }

    .duration-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(108, 99, 255, 0.28);
      transition: all var(--ease);
    }

    .chord-card.active .duration-dot { background: var(--purple); box-shadow: 0 0 6px rgba(108,99,255,0.6); }

    .card-add-btn {
      flex: 0 0 auto;
      width: 80px;
      height: 100%;
      border-radius: 16px;
      border: 1px dashed rgba(108, 99, 255, 0.22);
      background: rgba(12, 10, 24, 0.50);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--ease);
      font-size: 24px;
      color: rgba(108, 99, 255, 0.38);
    }

    .card-add-btn:hover {
      border-color: rgba(139, 92, 246, 0.48);
      color: rgba(167, 139, 250, 0.70);
      background: rgba(108, 99, 255, 0.08);
    }

    /* MIDI view strip */
    .midi-strip {
      border-top: 1px solid rgba(108, 99, 255, 0.14);
      background: linear-gradient(180deg, rgba(10, 9, 22, 0.90), rgba(7, 6, 16, 0.96));
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .midi-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 4px;
    }

    .midi-label {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    .midi-octave-btns {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .oct-btn {
      width: 22px; height: 18px;
      border-radius: 5px;
      border: 1px solid rgba(108,99,255,0.24);
      background: rgba(12, 10, 24, 0.72);
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--ease);
      font-family: inherit;
    }

    .oct-btn:hover {
      border-color: rgba(139,92,246,0.44);
      color: var(--purple-hi);
    }

    /* Piano keyboard */
    .piano-wrap {
      padding: 4px 12px 6px;
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 0;
    }

    .piano-wrap::-webkit-scrollbar { height: 3px; }
    .piano-wrap::-webkit-scrollbar-track { background: transparent; }
    .piano-wrap::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.28); border-radius: 2px; }

    .octave-group {
      display: flex;
      position: relative;
      flex-shrink: 0;
    }

    .piano-white {
      width: 28px;
      height: 82px;
      border-radius: 0 0 6px 6px;
      border: 1px solid rgba(108, 99, 255, 0.20);
      border-top: none;
      background: linear-gradient(180deg, rgba(38, 34, 68, 0.90) 0%, rgba(22, 18, 44, 0.96) 100%);
      position: relative;
      cursor: pointer;
      transition: background var(--ease), box-shadow var(--ease);
      z-index: 1;
    }

    .piano-white:hover {
      background: linear-gradient(180deg, rgba(55, 48, 96, 0.92) 0%, rgba(30, 25, 60, 0.96) 100%);
    }

    .piano-white.lit {
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.50), rgba(79, 70, 229, 0.38) 60%, rgba(55, 48, 96, 0.72) 100%);
      border-color: rgba(167, 139, 250, 0.55);
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.38), inset 0 -8px 14px rgba(0,0,0,0.28);
    }

    .piano-white.root-lit {
      background: linear-gradient(180deg, rgba(167, 139, 250, 0.70), rgba(139, 92, 246, 0.50) 60%, rgba(80, 60, 130, 0.72) 100%);
      border-color: rgba(220, 200, 255, 0.72);
      box-shadow: 0 0 18px rgba(167, 139, 250, 0.55), inset 0 -8px 14px rgba(0,0,0,0.22);
    }

    .piano-note-label {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 0.10em;
      color: var(--text-muted);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    .piano-white.lit .piano-note-label,
    .piano-white.root-lit .piano-note-label {
      color: rgba(255, 255, 255, 0.82);
    }

    .piano-black {
      width: 18px;
      height: 52px;
      border-radius: 0 0 5px 5px;
      border: 1px solid rgba(108, 99, 255, 0.16);
      border-top: none;
      background: linear-gradient(180deg, #0d0b1e 0%, #080612 70%, #0b0918 100%);
      position: absolute;
      z-index: 2;
      cursor: pointer;
      transition: background var(--ease), box-shadow var(--ease);
    }

    .piano-black:hover {
      background: linear-gradient(180deg, #1e1840 0%, #130f2a 100%);
    }

    .piano-black.lit {
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.72), rgba(79, 70, 229, 0.58));
      border-color: rgba(139, 92, 246, 0.60);
      box-shadow: 0 0 10px rgba(108, 99, 255, 0.44);
    }

    .piano-black.root-lit {
      background: linear-gradient(180deg, rgba(167, 139, 250, 0.86), rgba(139, 92, 246, 0.70));
      border-color: rgba(220, 200, 255, 0.72);
      box-shadow: 0 0 14px rgba(167, 139, 250, 0.60);
    }

    /* ── BOTTOM BAR: DRAG MIDI ── */
    .drag-bar {
      grid-row: 3;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      border-top: 1px solid rgba(108, 99, 255, 0.16);
      background: linear-gradient(180deg, rgba(9, 8, 20, 0.96), rgba(7, 6, 16, 0.99));
      position: relative;
      overflow: hidden;
    }

    .drag-bar::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--purple), var(--indigo));
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.6);
    }

    .drag-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(108, 99, 255, 0.32);
      background: rgba(108, 99, 255, 0.12);
      color: var(--purple-hi);
      flex-shrink: 0;
    }

    .drag-icon svg {
      width: 14px; height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .drag-text {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-soft);
    }

    .drag-sub {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .drag-bar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .export-btn {
      height: 28px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid rgba(108, 99, 255, 0.42);
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.18), rgba(79, 70, 229, 0.12));
      color: var(--purple-hi);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--ease);
      font-family: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .export-btn:hover {
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.30), rgba(79, 70, 229, 0.20));
      border-color: rgba(167, 139, 250, 0.65);
      box-shadow: 0 0 14px rgba(108, 99, 255, 0.28), inset 0 1px 0 rgba(255,255,255,0.16);
    }

    .export-format-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(108, 99, 255, 0.24);
      background: rgba(12, 10, 26, 0.82);
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
      font-family: inherit;
    }

    .export-format-btn.active, .export-format-btn:hover {
      border-color: rgba(139, 92, 246, 0.44);
      color: var(--text-soft);
    }

    /* ── PLAYBACK BAR (inside toolbar) ── */
    .play-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(108, 99, 255, 0.44);
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.22), rgba(79, 70, 229, 0.14));
      color: var(--purple-hi);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--ease);
      font-family: inherit;
    }

    .play-btn svg {
      width: 10px; height: 10px;
      fill: currentColor;
      stroke: none;
    }

    .play-btn:hover {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.38), rgba(79, 70, 229, 0.24));
      border-color: rgba(167, 139, 250, 0.65);
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.30);
    }

    .play-btn.playing {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.42), rgba(79, 70, 229, 0.28));
      border-color: rgba(167, 139, 250, 0.72);
      box-shadow: 0 0 16px rgba(108, 99, 255, 0.40);
    }
  </style>
</head>
<body>
<div class="plugin">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo-wrap">
        <img src="n_logo.png" alt="Nova" />
      </div>
      <div class="title-stack">
        <span class="title-nova">Nova</span>
        <span class="title-main">NOVA <span class="chord-word">CHORD</span></span>
      </div>
    </div>

    <div class="header-center">
      <div class="detect-badge">
        <div class="detect-dot"></div>
        <span class="detect-label">Live Detection</span>
      </div>
      <div class="key-sig" id="keySig">Key: C Major</div>
    </div>

    <div class="header-right">
      <div class="tempo-chip">
        <span id="tempoVal">120</span>
        <span class="tempo-unit">BPM</span>
      </div>
      <span class="byline">by International Nova</span>
    </div>
  </header>

  <!-- MAIN BODY -->
  <div class="body">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="current-chord-section">
        <div class="section-label">Detected Chord</div>
        <div class="chord-hero">
          <div class="chord-root" id="detectedRoot">Cmaj7</div>
          <div class="chord-quality" id="detectedQuality">Major Seventh</div>
          <div class="chord-extensions">
            <span class="ext-pill" id="ext1">C – E – G – B</span>
          </div>
          <div class="confidence-bar-wrap">
            <div class="confidence-bar-track">
              <div class="confidence-bar-fill" id="confidenceFill"></div>
            </div>
            <span class="confidence-pct" id="confidencePct">88%</span>
          </div>
        </div>
      </div>

      <div class="styles-section" id="styleList">
        <div class="section-label" style="margin-bottom: 8px;">Variations</div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

      <!-- TOOLBAR -->
      <div class="toolbar">
        <span class="toolbar-label">Progression</span>
        <button class="play-btn" id="playBtn" title="Play / Stop">
          <svg id="playIcon" viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg>
        </button>
        <button class="tool-btn active" id="btnLooping">LOOP</button>
        <button class="tool-btn" id="btnSnap">SNAP</button>
        <button class="tool-btn" id="btnAuto">AUTO</button>
        <div class="toolbar-spacer"></div>
        <span class="toolbar-label">Beats</span>
        <select class="beats-select" id="beatsSelect">
          <option>2</option>
          <option selected>4</option>
          <option>8</option>
          <option>16</option>
        </select>
        <button class="tool-btn" id="btnClear">CLEAR</button>
      </div>

      <!-- PROGRESSION CARDS -->
      <div class="progression-area" id="progressionArea"></div>

      <!-- MIDI STRIP -->
      <div class="midi-strip">
        <div class="midi-header">
          <span class="midi-label">MIDI Keyboard</span>
          <div class="midi-octave-btns">
            <button class="oct-btn" id="octDown">−</button>
            <span style="font-size:9px;letter-spacing:0.12em;color:var(--text-muted);align-self:center;" id="octaveDisplay">C3</span>
            <button class="oct-btn" id="octUp">+</button>
          </div>
        </div>
        <div class="piano-wrap" id="pianoWrap"></div>
      </div>

    </div>
  </div>

  <!-- DRAG BAR -->
  <div class="drag-bar">
    <div class="drag-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M5 10l7 7 7-7"/><path d="M3 21h18"/></svg>
    </div>
    <div>
      <div class="drag-text">Drag MIDI to your DAW</div>
      <div class="drag-sub">Drop onto a MIDI track or click Export to save</div>
    </div>
    <div class="drag-bar-right">
      <button class="export-format-btn active" id="fmtMidi">MIDI</button>
      <button class="export-format-btn" id="fmtXml">XML</button>
      <button class="export-btn" id="exportBtn">Export Progression</button>
    </div>
  </div>

</div>

<script>
/* ──────────────────────────────────────────────
   NOVA CHORD — UI ENGINE
   ────────────────────────────────────────────── */

// ── Chord Data ──────────────────────────────
const CHORD_STYLES = [
  { name: "Triad",        ext: "",     notes: "Root · 3rd · 5th",          semis: [0, 4, 7] },
  { name: "Major 7",      ext: "maj7", notes: "Root · 3rd · 5th · 7th",    semis: [0, 4, 7, 11] },
  { name: "Dominant 7",   ext: "7",    notes: "Root · 3rd · 5th · b7th",   semis: [0, 4, 7, 10] },
  { name: "Minor 7",      ext: "m7",   notes: "Root · b3rd · 5th · b7th",  semis: [0, 3, 7, 10] },
  { name: "Minor 9",      ext: "m9",   notes: "+ 9th",                     semis: [0, 3, 7, 10, 14] },
  { name: "Maj9",         ext: "maj9", notes: "+ Major 9th",               semis: [0, 4, 7, 11, 14] },
  { name: "Sus2",         ext: "sus2", notes: "Root · 2nd · 5th",          semis: [0, 2, 7] },
  { name: "Sus4",         ext: "sus4", notes: "Root · 4th · 5th",          semis: [0, 5, 7] },
  { name: "Add9",         ext: "add9", notes: "Triad + 9th",               semis: [0, 4, 7, 14] },
  { name: "Dim7",         ext: "°7",   notes: "Root · b3 · b5 · bb7",      semis: [0, 3, 6, 9] },
  { name: "Half-Dim",     ext: "ø7",   notes: "Root · b3 · b5 · b7",       semis: [0, 3, 6, 10] },
  { name: "Aug",          ext: "+",    notes: "Root · 3rd · #5th",         semis: [0, 4, 8] },
];

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const KEYS = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];

let state = {
  detectedRoot:    60,   // MIDI note C4
  detectedQuality: 0,    // index into CHORD_STYLES
  confidence:      88,
  styleIdx:        1,    // Major 7 selected
  octave:          3,    // piano start octave
  bpm:             120,
  keyRoot:         0,    // C
  playing:         false,
  currentBeat:     -1,
  looping:         true,
  snap:            false,
  autoAdd:         false,
  exportFmt:       "MIDI",
  progression: [
    { root: "C",  ext: "maj7", beats: 4, active: true  },
    { root: "A",  ext: "m7",   beats: 4, active: false },
    { root: "F",  ext: "maj7", beats: 4, active: false },
    { root: "G",  ext: "7",    beats: 4, active: false },
    { root: "E",  ext: "m7",   beats: 2, active: false },
    { root: "A",  ext: "m9",   beats: 2, active: false },
  ]
};

let playInterval = null;
let playStep = 0;

// ── Helper ───────────────────────────────────
function midiToNoteName(midi) {
  return NOTE_NAMES[midi % 12] + Math.floor(midi / 12 - 1);
}

function chordNotes(rootMidi, semiArr) {
  return semiArr.map(s => rootMidi + s);
}

// ── Populate Style List ───────────────────────
function buildStyleList() {
  const container = document.getElementById("styleList");
  // Keep the label
  const label = container.querySelector(".section-label");
  container.innerHTML = "";
  container.appendChild(label);

  CHORD_STYLES.forEach((style, i) => {
    const el = document.createElement("div");
    el.className = "style-item" + (i === state.styleIdx ? " active" : "");
    el.dataset.idx = i;
    el.innerHTML = `
      <div>
        <div class="style-name">${style.name}</div>
        <div class="style-notes">${style.notes}</div>
      </div>
      ${style.ext ? `<div class="ext-pill">${style.ext}</div>` : ""}
    `;
    el.addEventListener("click", () => {
      state.styleIdx = i;
      buildStyleList();
      updatePianoLit();
    });
    container.appendChild(el);
  });
}

// ── Update Header Detected ────────────────────
function updateDetected() {
  const root = NOTE_NAMES[state.detectedRoot % 12];
  const style = CHORD_STYLES[state.detectedQuality];
  const ext = style.ext;
  document.getElementById("detectedRoot").textContent = root + ext;
  document.getElementById("detectedQuality").textContent = style.name;
  const notes = chordNotes(state.detectedRoot, style.semis)
    .map(n => NOTE_NAMES[n % 12]).join(" – ");
  document.getElementById("ext1").textContent = notes;
  document.getElementById("confidenceFill").style.width = state.confidence + "%";
  document.getElementById("confidencePct").textContent = state.confidence + "%";
}

// ── Progression Cards ─────────────────────────
function buildProgression() {
  const area = document.getElementById("progressionArea");
  area.innerHTML = "";

  state.progression.forEach((chord, i) => {
    const card = document.createElement("div");
    card.className = "chord-card" + (chord.active ? " active" : "");
    card.dataset.idx = i;

    // Beat dots
    const dots = Array.from({ length: chord.beats }, () =>
      `<div class="duration-dot"></div>`
    ).join("");

    card.innerHTML = `
      <div class="card-beat">Bar ${i + 1}</div>
      <div class="card-root">${chord.root}</div>
      <div class="card-quality">${chord.ext || "maj"}</div>
      <div class="card-ext">${chord.beats} beats</div>
      <div class="card-duration">${dots}</div>
    `;
    card.addEventListener("click", () => {
      state.progression.forEach((c, j) => c.active = (j === i));
      buildProgression();
      updatePianoLit();
    });
    area.appendChild(card);
  });

  // Add button
  const addBtn = document.createElement("div");
  addBtn.className = "card-add-btn";
  addBtn.textContent = "+";
  addBtn.title = "Add chord";
  addBtn.addEventListener("click", addChordToProgression);
  area.appendChild(addBtn);
}

function addChordToProgression() {
  const style = CHORD_STYLES[state.styleIdx];
  const root = NOTE_NAMES[state.detectedRoot % 12];
  state.progression.forEach(c => c.active = false);
  state.progression.push({ root, ext: style.ext, beats: 4, active: true });
  buildProgression();
  updatePianoLit();
}

// ── Piano Keyboard ────────────────────────────
// Layout: white keys per octave [C D E F G A B], black keys positions
const WHITE_PATTERN = [0, 2, 4, 5, 7, 9, 11]; // semitones
const BLACK_PATTERN = [1, 3, -1, 6, 8, 10, -1]; // semitones, -1 = no black after
const BLACK_OFFSET  = [17, 17, 0, 17, 17, 17, 0]; // px offset from white key left

function litSemis() {
  const activeChord = state.progression.find(c => c.active);
  if (!activeChord) return { lits: [], root: -1 };

  const rootIdx = NOTE_NAMES.indexOf(activeChord.root.replace("♭","b"));
  const style = CHORD_STYLES.find(s => s.ext === activeChord.ext) || CHORD_STYLES[0];
  const lits = style.semis.map(s => (rootIdx + s) % 12);
  return { lits, root: rootIdx };
}

function buildPiano() {
  const wrap = document.getElementById("pianoWrap");
  wrap.innerHTML = "";
  const octaves = 3;

  for (let o = 0; o < octaves; o++) {
    const grp = document.createElement("div");
    grp.className = "octave-group";
    const oct = state.octave + o;

    WHITE_PATTERN.forEach((semi, wi) => {
      const key = document.createElement("div");
      key.className = "piano-white";
      key.dataset.semi = semi;
      key.dataset.oct = oct;
      const noteName = NOTE_NAMES[semi];
      if (noteName === "C") {
        const lbl = document.createElement("div");
        lbl.className = "piano-note-label";
        lbl.textContent = "C" + oct;
        key.appendChild(lbl);
      }
      grp.appendChild(key);

      // Black key after?
      const bSemi = BLACK_PATTERN[wi];
      if (bSemi >= 0) {
        const bKey = document.createElement("div");
        bKey.className = "piano-black";
        bKey.dataset.semi = bSemi;
        bKey.dataset.oct = oct;
        bKey.style.left = (wi * 28 + BLACK_OFFSET[wi]) + "px";
        grp.appendChild(bKey);
      }
    });

    wrap.appendChild(grp);
  }
  updatePianoLit();
}

function updatePianoLit() {
  const { lits, root } = litSemis();
  document.querySelectorAll(".piano-white, .piano-black").forEach(k => {
    const s = parseInt(k.dataset.semi);
    k.classList.remove("lit", "root-lit");
    if (s === root) {
      k.classList.add("root-lit");
    } else if (lits.includes(s)) {
      k.classList.add("lit");
    }
  });
}

// ── Playback ──────────────────────────────────
function startPlayback() {
  if (playInterval) clearInterval(playInterval);
  playStep = 0;
  const beatMs = (60000 / state.bpm);
  playInterval = setInterval(() => {
    const prog = state.progression;
    if (!prog.length) return;
    prog.forEach((c, i) => c.active = (i === playStep % prog.length));
    playStep++;
    if (!state.looping && playStep >= prog.length) stopPlayback();
    buildProgression();
    updatePianoLit();
  }, beatMs * 2);
}

function stopPlayback() {
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
  state.playing = false;
  document.getElementById("playBtn").classList.remove("playing");
  document.getElementById("playIcon").innerHTML = '<polygon points="2,1 9,5 2,9"/>';
}

// ── Simulate Detection Animation ─────────────
function simulateDetection() {
  const roots = [48, 53, 57, 60, 64, 67];
  const quals = [0, 1, 2, 3, 5];
  setInterval(() => {
    if (!state.playing) {
      state.detectedRoot    = roots[Math.floor(Math.random() * roots.length)];
      state.detectedQuality = quals[Math.floor(Math.random() * quals.length)];
      state.confidence      = 74 + Math.floor(Math.random() * 22);
      updateDetected();
    }
  }, 3400);
}

// ── JUCE Interop Stub ─────────────────────────
function ensureJuceInterop() {
  if (window.__JUCE__ && window.__JUCE__.backend) return;
  const noop = () => {};
  window.__JUCE__ = {
    backend: { addEventListener: noop, removeEventListener: noop, emitEvent: noop },
    initialisationData: { __juce__functions: [], __juce__sliders: [], __juce__toggles: [], __juce__comboBoxes: [] },
  };
}

// ── Wire UI Events ────────────────────────────
function wireEvents() {
  // Play button
  document.getElementById("playBtn").addEventListener("click", () => {
    state.playing = !state.playing;
    const btn = document.getElementById("playBtn");
    if (state.playing) {
      btn.classList.add("playing");
      document.getElementById("playIcon").innerHTML = '<rect x="2" y="1" width="3" height="8"/><rect x="6" y="1" width="3" height="8"/>';
      startPlayback();
    } else {
      stopPlayback();
    }
  });

  // Toolbar toggles
  ["btnLooping","btnSnap","btnAuto"].forEach(id => {
    document.getElementById(id).addEventListener("click", function() {
      this.classList.toggle("active");
      if (id === "btnLooping") state.looping = this.classList.contains("active");
      if (id === "btnSnap")    state.snap    = this.classList.contains("active");
      if (id === "btnAuto")    state.autoAdd = this.classList.contains("active");
    });
  });

  // Clear
  document.getElementById("btnClear").addEventListener("click", () => {
    state.progression = [];
    stopPlayback();
    buildProgression();
  });

  // Key sig
  let keyIdx = 0;
  document.getElementById("keySig").addEventListener("click", () => {
    keyIdx = (keyIdx + 1) % KEYS.length;
    state.keyRoot = keyIdx;
    document.getElementById("keySig").textContent = "Key: " + KEYS[keyIdx] + " Major";
  });

  // Octave
  document.getElementById("octDown").addEventListener("click", () => {
    if (state.octave > 1) { state.octave--; document.getElementById("octaveDisplay").textContent = "C" + state.octave; buildPiano(); }
  });
  document.getElementById("octUp").addEventListener("click", () => {
    if (state.octave < 6) { state.octave++; document.getElementById("octaveDisplay").textContent = "C" + state.octave; buildPiano(); }
  });

  // Export format
  document.getElementById("fmtMidi").addEventListener("click", function() {
    this.classList.add("active");
    document.getElementById("fmtXml").classList.remove("active");
    state.exportFmt = "MIDI";
  });
  document.getElementById("fmtXml").addEventListener("click", function() {
    this.classList.add("active");
    document.getElementById("fmtMidi").classList.remove("active");
    state.exportFmt = "XML";
  });

  // Export
  document.getElementById("exportBtn").addEventListener("click", () => {
    const btn = document.getElementById("exportBtn");
    const orig = btn.textContent;
    btn.textContent = "Exported!";
    btn.style.borderColor = "rgba(167,139,250,0.8)";
    setTimeout(() => { btn.textContent = orig; btn.style.borderColor = ""; }, 1400);
    // In real plugin, call __JUCE__.backend.emitEvent("exportMidi", { format: state.exportFmt })
  });

  // Piano key clicks (trigger visual only)
  document.getElementById("pianoWrap").addEventListener("click", e => {
    const key = e.target.closest(".piano-white, .piano-black");
    if (!key) return;
    // Flash key
    const cls = key.classList.contains("piano-black") ? "piano-black" : "piano-white";
    key.classList.add("lit");
    setTimeout(() => { updatePianoLit(); }, 280);
  });
}

// ── Init ──────────────────────────────────────
function init() {
  ensureJuceInterop();
  buildStyleList();
  updateDetected();
  buildProgression();
  buildPiano();
  wireEvents();
  simulateDetection();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
