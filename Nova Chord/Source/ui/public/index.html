<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Chord</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #08111d;
      --bg2:       #0d1a2a;
      --bg3:       #112035;
      --border:    #1e3a5f;
      --accent:    #6c63ff;
      --accent2:   #4fc3f7;
      --text:      #e0e8f0;
      --text-dim:  #5a7a9a;
      --green:     #43e97b;
      --yellow:    #ffd740;
      --red:       #ff5c8a;
    }

    html, body {
      width: 1060px; height: 640px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    #logo { height: 28px; opacity: 0.9; }

    #title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .spacer { flex: 1; }

    /* ── Controls row ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    select:hover { border-color: var(--accent); }

    /* ── Detection bar ── */
    #detect-bar {
      display: flex;
      align-items: center;
      padding: 6px 20px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 34px;
    }

    #detect-label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #detected-note {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent2);
      min-width: 80px;
    }

    #detect-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.2s;
    }

    #detect-dot.active { background: var(--green); }

    /* ── Main layout ── */
    #main {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: calc(640px - 34px - 46px - 34px - 1px);
    }

    /* ── Suggestions panel ── */
    #suggestions-panel {
      padding: 14px 16px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    #suggestions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .chord-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }

    .chord-btn:hover {
      border-color: var(--accent);
      background: #1a2e4a;
    }

    .chord-btn:active {
      transform: scale(0.96);
    }

    .chord-btn.playing {
      border-color: var(--green);
      background: #0d2e1a;
      box-shadow: 0 0 12px rgba(67, 233, 123, 0.25);
    }

    .chord-btn .chord-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: block;
    }

    .chord-btn .chord-actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .chord-btn:hover .chord-actions { opacity: 1; }

    .chord-action-btn {
      font-size: 10px;
      background: rgba(108,99,255,0.2);
      border: 1px solid rgba(108,99,255,0.4);
      border-radius: 4px;
      color: var(--accent);
      padding: 2px 6px;
      cursor: pointer;
    }

    .chord-action-btn:hover { background: rgba(108,99,255,0.4); }

    /* ── Right panel ── */
    #right-panel {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── AI section ── */
    #ai-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #ai-section .panel-title { margin-bottom: 8px; }

    #prompt-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    #prompt-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    #prompt-input:focus { border-color: var(--accent); }
    #prompt-input::placeholder { color: var(--text-dim); }

    #generate-btn {
      background: linear-gradient(135deg, var(--accent), #5b52e0);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    #generate-btn:hover { opacity: 0.9; }
    #generate-btn:disabled { opacity: 0.4; cursor: default; }

    #api-key-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .api-label {
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    #api-key-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--text);
      font-size: 11px;
      outline: none;
      font-family: monospace;
    }

    #api-key-input:focus { border-color: var(--accent); }

    #ai-status {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      min-height: 14px;
    }

    /* ── Progression section ── */
    #progression-section {
      padding: 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #progression-section .panel-title { margin-bottom: 8px; }

    #progression-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .prog-item {
      display: flex;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .prog-item:hover { border-color: var(--accent2); }
    .prog-item:active { transform: scale(0.98); }

    .prog-item.playing {
      border-color: var(--green);
      background: #0d2e1a;
    }

    .prog-num {
      font-size: 10px;
      color: var(--text-dim);
      width: 14px;
      text-align: right;
    }

    .prog-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .prog-remove {
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .prog-item:hover .prog-remove { opacity: 1; }
    .prog-remove:hover { color: var(--red); }

    #prog-empty {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 16px 0;
    }

    #progression-actions {
      display: flex;
      gap: 6px;
    }

    .prog-action-btn {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 0;
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .prog-action-btn:hover { border-color: var(--accent); color: var(--accent); }

    #export-btn { border-color: rgba(108,99,255,0.3); }
    #clear-btn  { border-color: rgba(255,92,138,0.3); }
    #clear-btn:hover { border-color: var(--red); color: var(--red); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<div id="header">
  <img id="logo" src="n_logo.png" alt="N" />
  <span id="title">Nova Chord</span>
  <div class="spacer"></div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Key</span>
    <select id="key-select">
      <option value="0">C</option>
      <option value="1">C#</option>
      <option value="2">D</option>
      <option value="3">D#</option>
      <option value="4">E</option>
      <option value="5">F</option>
      <option value="6">F#</option>
      <option value="7">G</option>
      <option value="8">G#</option>
      <option value="9">A</option>
      <option value="10">A#</option>
      <option value="11">B</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Scale</span>
    <select id="scale-select">
      <option value="0">Major</option>
      <option value="1">Minor</option>
      <option value="2">Dorian</option>
      <option value="3">Mixolydian</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Style</span>
    <select id="style-select">
      <option value="0">Pop</option>
      <option value="1">Jazz</option>
      <option value="2">Classical</option>
      <option value="3">Blues</option>
    </select>
  </div>
</div>

<div id="detect-bar">
  <div id="detect-dot"></div>
  <span class="ctrl-label" id="detect-label">Detected:</span>
  <span id="detected-note">—</span>
</div>

<div id="main">
  <!-- Suggestions -->
  <div id="suggestions-panel">
    <div class="panel-title">Suggestions — click to play, + to add to progression</div>
    <div id="suggestions-grid">
      <!-- Chord buttons injected by JS -->
    </div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">
    <!-- AI section -->
    <div id="ai-section">
      <div class="panel-title">AI Progression</div>
      <div id="prompt-row">
        <input id="prompt-input" type="text" placeholder='e.g. "sad upbeat jazz ballad"' />
        <button id="generate-btn">Generate ▶</button>
      </div>
      <div id="api-key-row">
        <span class="api-label">API Key:</span>
        <input id="api-key-input" type="password" placeholder="sk-ant-..." />
      </div>
      <div id="ai-status"></div>
    </div>

    <!-- Progression -->
    <div id="progression-section">
      <div class="panel-title">Progression (max 8)</div>
      <div id="progression-list">
        <div id="prog-empty">No chords yet — add from suggestions above</div>
      </div>
      <div id="progression-actions">
        <button class="prog-action-btn" id="clear-btn">✕ Clear</button>
        <button class="prog-action-btn" id="export-btn">⬇ Export MIDI</button>
      </div>
    </div>
  </div>
</div>

<script src="js/juce/check_native_interop.js"></script>
<script src="js/juce/index.js"></script>
<script src="js/fallback-boot.js"></script>
<script src="js/index.js"></script>
</body>
</html>
