<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nova Bass</title>
<style>
  :root {
    --bg-black: #0a0a0c;
    --bg-charcoal: #161619;
    --bg-charcoal-2: #1d1d21;
    --border-soft: #2a2a2f;
    --cream: #f2ede4;
    --cream-dim: #b9b3a8;
    --green: #7fe8b0;
    --green-dim: #4d9e78;
    --gold: #d8a856;
    --gold-dim: #9c7a42;
    --orange-accent: #e0975a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-black);
    color: var(--cream);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    overflow: hidden;
  }

  /* Fixed design canvas, uniformly scaled to fit the actual window size
     (same technique across the catalog - see Nova Tape's index.html for
     the rationale). #app used to be 100%/100% fluid with no scaling, so
     resizing the window just spread the same pixel-fixed controls across
     more empty space rather than scaling them together. */
  #stageOuter { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #app {
    display: flex;
    flex-direction: column;
    width: 1150px;
    height: 720px;
    flex: 0 0 auto;
    transform-origin: center center;
  }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .brand { display: flex; flex-direction: column; line-height: 1; }
  .brand .nova { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--cream); }
  .brand .audio { font-size: 9px; font-weight: 600; letter-spacing: 3px; color: var(--gold); margin-top: 2px; }

  .title-block { text-align: center; }
  .title-block .name { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .title-block .name .bass { color: var(--green); }
  .title-block .subtitle { font-size: 10px; letter-spacing: 4px; color: var(--gold); margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .mini-wave { width: 40px; height: 18px; opacity: 0.8; }
  #bypassBtn {
    background: var(--bg-charcoal);
    border: 1px solid var(--border-soft);
    color: var(--cream-dim);
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #bypassBtn.active { color: var(--bg-black); background: var(--gold); border-color: var(--gold); }
  #powerDot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* ---------- BODY LAYOUT ---------- */
  #body { flex: 1; display: flex; min-height: 0; }

  /* ---------- LEFT: PRESET BROWSER ---------- */
  #leftPanel {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    padding: 14px;
    min-height: 0;
  }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border-soft); margin-bottom: 12px; }
  .tab { font-size: 12px; letter-spacing: 1px; padding-bottom: 8px; color: var(--cream-dim); cursor: pointer; }
  .tab.active { color: var(--green); border-bottom: 2px solid var(--green); }

  #searchBox {
    width: 100%;
    background: var(--bg-charcoal);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    color: var(--cream);
    font-size: 12px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  #searchBox::placeholder { color: #6b6a66; }

  .section-label { font-size: 10px; letter-spacing: 2px; color: var(--cream-dim); margin: 6px 0; }

  #categoryList { max-height: 130px; overflow-y: auto; margin-bottom: 6px; }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; border-radius: 5px; font-size: 12px; color: var(--cream-dim); cursor: pointer;
  }
  .cat-row.selected { background: rgba(127, 232, 176, 0.12); color: var(--green); }
  .cat-count { font-size: 10px; color: #6b6a66; }

  #presetList { flex: 1; overflow-y: auto; min-height: 0; }
  .preset-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 9px; border-radius: 5px; font-size: 12.5px; color: var(--cream-dim); cursor: pointer;
  }
  .preset-row.selected { background: rgba(216, 168, 86, 0.14); color: var(--cream); }
  .star { color: #4a4944; cursor: pointer; font-size: 12px; }
  .star.favorite { color: var(--gold); }

  /* ---------- CENTER HERO ---------- */
  #centerPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    min-width: 0;
  }
  .preset-nav { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
  .nav-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--border-soft); background: var(--bg-charcoal);
    color: var(--cream-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #presetName { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #favHeart { cursor: pointer; color: #4a4944; font-size: 15px; }
  #favHeart.favorite { color: var(--gold); }

  #orbWrap { position: relative; width: 260px; height: 260px; margin: 18px 0 10px; }
  #orbSvg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .orb-track { fill: none; stroke: var(--bg-charcoal-2); stroke-width: 10; }
  .orb-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.05s linear; }
  #orbCore {
    position: absolute; inset: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #202024, #08080a 72%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    cursor: ns-resize;
  }
  #orbCore .label { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--gold); }
  #orbCore .value { font-size: 44px; font-weight: 800; color: var(--cream); line-height: 1; margin-top: 2px; }

  #subtleExtreme { display: flex; align-items: center; gap: 10px; width: 300px; font-size: 9px; letter-spacing: 2px; color: var(--cream-dim); }
  #bassRange { flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--green), var(--gold)); cursor: pointer; }
  #bassRange::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--cream); border: 2px solid var(--gold); }

  #description { max-width: 380px; text-align: center; font-size: 12.5px; color: var(--cream-dim); margin-top: 16px; line-height: 1.5; }

  /* ---------- RIGHT: KNOB PANEL ---------- */
  #rightPanel {
    width: 320px;
    flex-shrink: 0;
    border-left: 1px solid var(--border-soft);
    padding: 24px 20px;
    display: flex;
    flex-direction: row;
    gap: 20px;
    overflow-y: auto;
    min-height: 0;
  }
  #knobColumn { display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .knob-group { display: flex; flex-direction: column; align-items: center; }
  .knob-label { font-size: 10px; letter-spacing: 2px; color: var(--cream-dim); margin-bottom: 8px; }
  .knob {
    --turn: -135deg;
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2c2c30, #0c0c0e 75%);
    border: 1px solid var(--border-soft);
    position: relative;
    cursor: ns-resize;
  }
  .knob.medium { width: 56px; height: 56px; }
  .knob.small { width: 38px; height: 38px; }
  .knob::before {
    content: "";
    position: absolute; left: 50%; top: 6px; width: 2px; height: 40%;
    background: var(--green);
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(var(--turn));
    border-radius: 2px;
  }
  .knob-readout { font-size: 10.5px; color: var(--cream-dim); margin-top: 6px; }

  /* COLOR sits in its own column to the RIGHT of the knob column (per
     approved mockup), roughly vertically centered alongside DRIVE/WIDTH -
     not stacked below all five knobs. */
  #colorColumn {
    width: 96px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .color-group-label { font-size: 10px; letter-spacing: 2px; color: var(--cream-dim); text-align: center; margin-bottom: 4px; }
  .color-btn {
    width: 100%;
    padding: 10px 8px;
    border-radius: 7px;
    border: 1px solid var(--border-soft);
    background: var(--bg-charcoal);
    color: var(--cream-dim);
    font-size: 10.5px;
    letter-spacing: 1px;
    text-align: center;
    cursor: pointer;
  }
  .color-btn.active { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px rgba(127,232,176,0.25) inset; }

  /* ---------- FOOTER ---------- */
  footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px; border-top: 1px solid var(--border-soft); flex-shrink: 0;
  }
  #footerWave { width: 130px; height: 22px; opacity: 0.55; }
  #tagline { font-size: 10px; letter-spacing: 3px; color: var(--cream-dim); }
  #tagline .g { color: var(--green); }
  #tagline .gold { color: var(--gold); }
  #signature { font-family: "Snell Roundhand", "Brush Script MT", cursive; font-size: 15px; color: var(--gold); }

  /* ---------- UNLOCK OVERLAY (native JUCE component sits above this) ---------- */
  #locateHint { position: fixed; bottom: 8px; right: 12px; font-size: 9px; color: #4a4944; cursor: pointer; }
</style>
</head>
<body>
<div id="stageOuter">
<div id="app">
  <header>
    <div class="brand"><span class="nova">NOVA</span><span class="audio">AUDIO</span></div>
    <div class="title-block">
      <div class="name">NOVA <span class="bass">BASS</span></div>
      <div class="subtitle">BASS ENGINE</div>
    </div>
    <div class="header-right">
      <svg class="mini-wave" viewBox="0 0 40 18"><polyline points="0,9 5,4 10,14 15,2 20,16 25,6 30,12 35,8 40,9" fill="none" stroke="#7fe8b0" stroke-width="1.4"/></svg>
      <button id="bypassBtn">BYPASS</button>
      <div id="powerDot"></div>
    </div>
  </header>

  <div id="body">
    <div id="leftPanel">
      <div class="tabs">
        <div class="tab active" data-tab="presets">PRESETS</div>
        <div class="tab" data-tab="favorites">FAVORITES</div>
      </div>
      <input id="searchBox" placeholder="Search presets..." />
      <div class="section-label">CATEGORIES</div>
      <div id="categoryList"></div>
      <div class="section-label">PRESETS</div>
      <div id="presetList"></div>
    </div>

    <div id="centerPanel">
      <div class="preset-nav">
        <div class="nav-btn" id="prevBtn">&#8249;</div>
        <div id="presetName">--</div>
        <div id="favHeart">&#9825;</div>
        <div class="nav-btn" id="nextBtn">&#8250;</div>
      </div>

      <div id="orbWrap">
        <svg id="orbSvg" viewBox="0 0 200 200">
          <circle class="orb-track" cx="100" cy="100" r="88"/>
          <circle id="orbFillGreen" class="orb-fill" cx="100" cy="100" r="88" stroke="#7fe8b0" stroke-dasharray="276.5" stroke-dashoffset="276.5"/>
          <circle id="orbFillGold" class="orb-fill" cx="100" cy="100" r="88" stroke="#d8a856" stroke-dasharray="276.5" stroke-dashoffset="276.5"/>
        </svg>
        <div id="orbCore">
          <div class="label">BASS</div>
          <div class="value" id="bassValue">50</div>
        </div>
      </div>

      <div id="subtleExtreme">
        <span>SUBTLE</span>
        <input type="range" id="bassRange" min="0" max="100" value="50" />
        <span>EXTREME</span>
      </div>

      <div id="description">Deep and powerful bass with rich low-end character.</div>
    </div>

    <div id="rightPanel">
      <div id="knobColumn">
        <div class="knob-group"><div class="knob-label">SHAPE</div><div class="knob" data-param="shape"></div><div class="knob-readout" data-readout="shape">50%</div></div>
        <div class="knob-group"><div class="knob-label">DECAY</div><div class="knob" data-param="decay"></div><div class="knob-readout" data-readout="decay">50%</div></div>
        <div class="knob-group"><div class="knob-label">DRIVE</div><div class="knob medium" data-param="drive"></div><div class="knob-readout" data-readout="drive">30%</div></div>
        <div class="knob-group"><div class="knob-label">WIDTH</div><div class="knob" data-param="width"></div><div class="knob-readout" data-readout="width">50%</div></div>
        <div class="knob-group"><div class="knob-label">GLIDE</div><div class="knob small" data-param="glide"></div><div class="knob-readout" data-readout="glide">20%</div></div>
      </div>

      <div id="colorColumn">
        <div class="color-group-label">COLOR</div>
        <div class="color-btn" data-color="0">CLEAN</div>
        <div class="color-btn active" data-color="1">WARM</div>
        <div class="color-btn" data-color="2">GRITTY</div>
      </div>
    </div>
  </div>

  <footer>
    <svg id="footerWave" viewBox="0 0 130 22"><polyline points="0,11 8,3 16,18 24,1 32,20 40,6 48,15 56,4 64,17 72,8 80,13 88,5 96,16 104,9 112,14 120,7 130,11" fill="none" stroke="#7fe8b0" stroke-width="1.2"/></svg>
    <div id="tagline">NATURAL. <span class="g">DEEP</span>. <span class="gold">POWERFUL</span>.</div>
    <div id="signature">Nova Audio</div>
  </footer>
</div>
</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
