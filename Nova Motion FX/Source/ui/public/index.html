<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=960"/>
<title>Nova Motion FX</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0e0e11;
  --panel:       #161619;
  --panel2:      #131316;
  --border:      rgba(142,91,255,0.15);
  --purple:      #8E5BFF;
  --purple-soft: #b08aff;
  --purple-lite: #d0b8ff;
  --text:        #ede8f8;
  --muted:       rgba(200,185,230,0.52);
  --pill-bg:     rgba(142,91,255,0.09);
  --pill-on:     rgba(142,91,255,0.32);
}

html, body {
  width: 960px; height: 620px;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 11px;
  user-select: none;
  -webkit-user-select: none;
}

#root {
  display: flex;
  flex-direction: column;
  width: 960px; height: 620px;
}

/* ─── HEADER ──────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 48px;
  padding: 0 18px;
  background: #0a0a0d;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 9px; }
#logo-img { width: 26px; height: 26px; object-fit: contain; }
.logo-fb {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #8E5BFF, #c8a0ff);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 13px; color: #fff; flex-shrink: 0;
}
.title-block { display: flex; flex-direction: column; gap: 1px; }
.plugin-name { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; }
.plugin-sub  { font-size: 8.5px; letter-spacing: 0.2em; color: var(--muted); }

.preset-bar {
  display: flex; align-items: center; gap: 5px;
  background: rgba(142,91,255,0.07);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 4px 10px;
}
.preset-arrow {
  background: none; border: none; color: var(--purple-soft);
  cursor: pointer; font-size: 16px; padding: 0; line-height: 1;
}
.preset-arrow:hover { color: var(--text); }
.preset-name {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
  min-width: 120px; text-align: center;
}
.preset-save {
  background: rgba(142,91,255,0.18);
  border: 1px solid rgba(142,91,255,0.4);
  border-radius: 9px; color: var(--purple-lite);
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em;
  padding: 2px 8px; cursor: pointer;
}
.preset-save:hover { background: rgba(142,91,255,0.35); }

.header-right { display: flex; align-items: center; gap: 8px; }
.power-btn {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(142,91,255,0.1);
  border: 1px solid rgba(142,91,255,0.28);
  color: var(--purple-soft); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.power-btn:hover { background: rgba(142,91,255,0.25); color: var(--text); }

/* ─── HERO ────────────────────────────────── */
#hero {
  display: flex; align-items: center; justify-content: center;
  height: 158px; flex-shrink: 0; position: relative;
  background: radial-gradient(ellipse 260px 100px at 50% 100%, rgba(142,91,255,0.10) 0%, transparent 70%);
}
.hero-label {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 700; letter-spacing: 0.36em;
  color: var(--purple-soft); text-transform: uppercase;
}
.hero-knob-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
}
.hero-glow {
  position: absolute; width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(142,91,255,0.22) 0%, rgba(142,91,255,0.06) 55%, transparent 75%);
  pointer-events: none; top: 50%; left: 50%; transform: translate(-50%,-54%);
}
.hero-value {
  font-size: 10.5px; font-weight: 600; color: var(--purple-lite);
  margin-top: 2px; text-align: center; letter-spacing: 0.04em;
}

/* ─── MAIN BODY ───────────────────────────── */
#main-body {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  flex: 1; min-height: 0;
  border-top: 1px solid var(--border);
}
.section {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 11px 14px 10px; gap: 7px;
  overflow: hidden;
}
.section:last-child { border-right: none; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.section-title {
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.3em;
  color: var(--purple-soft); text-transform: uppercase;
}

.pill-group { display: flex; gap: 3px; }
.pill {
  background: var(--pill-bg); border: 1px solid rgba(142,91,255,0.18);
  border-radius: 9px; color: var(--muted);
  font-size: 8px; font-weight: 700; letter-spacing: 0.07em;
  padding: 2px 7px; cursor: pointer; white-space: nowrap;
}
.pill.active, .pill:hover {
  background: var(--pill-on); border-color: rgba(142,91,255,0.55); color: var(--text);
}

/* Canvas */
.display-canvas {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(142,91,255,0.1);
  border-radius: 6px; width: 100%;
  display: block; flex-shrink: 0;
}

/* Delay time */
.delay-time-row {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.delay-time-display {
  background: rgba(0,0,0,0.5); border: 1px solid rgba(142,91,255,0.22);
  border-radius: 5px; padding: 3px 14px;
  font-size: 18px; font-weight: 700; color: var(--purple-lite);
  letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
}
.sync-btn {
  background: rgba(142,91,255,0.12); border: 1px solid rgba(142,91,255,0.32);
  border-radius: 5px; color: var(--purple-soft);
  font-size: 8px; font-weight: 700; letter-spacing: 0.12em;
  padding: 4px 10px; cursor: pointer;
}
.sync-btn.active, .sync-btn:hover { background: rgba(142,91,255,0.3); color: var(--text); }

.freeze-btn {
  background: rgba(142,91,255,0.09); border: 1px solid rgba(142,91,255,0.28);
  border-radius: 5px; color: var(--purple-soft);
  font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
  padding: 3px 9px; cursor: pointer;
}
.freeze-btn:hover, .freeze-btn.active {
  background: rgba(142,91,255,0.32); color: var(--text); border-color: var(--purple);
}

/* Knob row */
.knob-row {
  display: flex; justify-content: space-around; align-items: flex-end;
  gap: 4px; flex-shrink: 0;
}

/* ─────────────────────────────────────────────
   PREMIUM CSS KNOBS
   Body uses CSS radial-gradient + box-shadow
   Arc uses SVG stroke only (no cross-SVG fill refs)
────────────────────────────────────────────── */

/* All knobs share the same wrapper pattern */
.knob, .mini-knob {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px; cursor: ns-resize;
}

/* The shell is the hit-area and positioning context */
.knob-shell {
  position: relative;
  flex-shrink: 0;
}

/* SVG arc sits in the shell, pointer-events none */
.knob-svg {
  position: absolute; top: 0; left: 0;
  overflow: visible; pointer-events: none;
}

/* CSS body: premium 3-D depth with radial gradient + shadow */
.knob-body {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 36% 28%,
    rgba(210,180,255,0.42) 0%,
    rgba(55,32,110,0.88) 28%,
    rgba(18,9,40,1)       72%,
    rgba(8,4,18,1)        100%
  );
  box-shadow:
    0 8px 24px rgba(0,0,0,0.90),
    0 3px 8px  rgba(0,0,0,0.70),
    inset 0 2px 6px rgba(255,255,255,0.14),
    inset 0 -2px 5px rgba(0,0,0,0.55),
    0 0 20px rgba(142,91,255,0.10);
}
/* Gloss specular highlight */
.knob-body::after {
  content: '';
  position: absolute; border-radius: 50%;
  top: 8%; left: 14%; width: 46%; height: 32%;
  background: radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.20) 0%, transparent 70%);
  pointer-events: none;
}

/* Indicator: fills the whole shell, dot at top-centre, rotates around knob centre */
.knob-indicator {
  position: absolute; top: 0; left: 0;
  right: 0; bottom: 0;
  border-radius: 50%;
  pointer-events: none;
}
.knob-dot {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  border-radius: 2px;
  background: linear-gradient(to bottom, #e4cfff, #8E5BFF);
  box-shadow: 0 0 6px rgba(142,91,255,0.85);
}

/* ── Motion knob (120×120) ── */
.motion-shell { width: 120px; height: 120px; }
.motion-shell .knob-body { top:10px; left:10px; width:100px; height:100px; }
.motion-shell .knob-dot  { top:8px; width:4px; height:16px; }

/* ── Standard knob (72×72) ── */
.std-shell { width: 72px; height: 72px; }
.std-shell .knob-body { top:8px; left:8px; width:56px; height:56px; }
.std-shell .knob-dot  { top:5px; width:3px; height:11px; }

/* ── Mini knob (40×40) ── */
.mini-shell { width: 40px; height: 40px; }
.mini-shell .knob-body { top:5px; left:5px; width:30px; height:30px; }
.mini-shell .knob-dot  { top:3px; width:2px; height:7px; }

/* Knob labels */
.knob-label {
  font-size: 8.5px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase; text-align: center;
}
.knob-value {
  font-size: 8px; color: var(--purple-lite); min-width: 32px;
  text-align: center; font-variant-numeric: tabular-nums;
}

/* ─── BOTTOM ROW ──────────────────────────── */
#bottom-row {
  display: flex; height: 100px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--panel2);
}
#lfo-section {
  display: flex; flex-direction: column; flex: 1;
  padding: 8px 14px; gap: 5px;
  border-right: 1px solid var(--border);
}
#master-section {
  display: flex; flex-direction: column;
  width: 210px; flex-shrink: 0;
  padding: 8px 12px; gap: 6px;
}
.bottom-title {
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.3em;
  color: var(--purple-soft); text-transform: uppercase; flex-shrink: 0;
}
.lfo-inner {
  display: flex; align-items: flex-end; gap: 10px; flex: 1; min-height: 0;
}
.lfo-target-wrap { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.lfo-target-label { font-size: 7.5px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.lfo-target-select {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text); font-size: 9px;
  padding: 3px 6px; cursor: pointer; outline: none; -webkit-appearance: none;
}
.mini-knob-row { display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; }
#lfo-canvas {
  flex: 1; min-width: 0; height: 54px; border-radius: 5px;
  background: rgba(0,0,0,0.38); border: 1px solid rgba(142,91,255,0.1);
  display: block;
}
.master-inner { display: flex; align-items: flex-end; gap: 8px; }
/* meter */
.meter-group { display: flex; gap: 4px; align-items: flex-end; flex-shrink: 0; margin-left: 4px; }
.meter-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.meter-ch { font-size: 7px; color: var(--muted); letter-spacing: 0.06em; }
.meter-track {
  width: 8px; height: 48px;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(142,91,255,0.14);
  border-radius: 4px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.meter-bar { width: 100%; background: linear-gradient(to top, #8E5BFF, #c8a0ff); border-radius: 3px; }

/* ─── STATUS BAR ──────────────────────────── */
#status-bar {
  display: flex; align-items: center; justify-content: space-between;
  height: 26px; padding: 0 14px;
  background: #080809; border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.bar-left, .bar-right { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 8px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.bar-toggle {
  background: rgba(142,91,255,0.15); border: 1px solid rgba(142,91,255,0.28);
  border-radius: 7px; color: var(--purple-soft); font-size: 7.5px; font-weight: 700;
  letter-spacing: 0.1em; padding: 2px 7px; cursor: pointer;
}
.bar-toggle.active { background: rgba(142,91,255,0.38); color: var(--text); }
.bar-select {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text); font-size: 8px;
  padding: 2px 4px; outline: none; cursor: pointer; -webkit-appearance: none;
}
.bar-btn {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 5px; color: var(--muted); font-size: 8px; font-weight: 600;
  letter-spacing: 0.06em; padding: 2px 7px; cursor: pointer;
}
.bar-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.bar-sep { width: 1px; height: 12px; background: var(--border); }
</style>
</head>
<body>
<div id="root">

<!-- ══════════════════════════════════ HEADER -->
<div id="header">
  <div class="header-left">
    <img id="logo-img" src="n_logo.png" alt="N"
         onerror="this.style.display='none';document.getElementById('logo-fb').style.display='flex'"/>
    <div class="logo-fb" id="logo-fb" style="display:none">N</div>
    <div class="title-block">
      <span class="plugin-name">NOVA AUDIO</span>
      <span class="plugin-sub">NOVA MOTION FX &nbsp;·&nbsp; FILTER · DELAY · REVERB</span>
    </div>
  </div>

  <div class="preset-bar">
    <button class="preset-arrow" id="prev-preset">&#8249;</button>
    <span class="preset-name" id="preset-name">CITRUS SPLASH</span>
    <button class="preset-arrow" id="next-preset">&#8250;</button>
    <button class="preset-save">SAVE</button>
  </div>

  <div class="header-right">
    <button class="power-btn" id="power-btn">&#9211;</button>
  </div>
</div>

<!-- ══════════════════════════════════ HERO – MOTION -->
<div id="hero">
  <span class="hero-label">MOTION</span>
  <div class="hero-knob-wrap">
    <div class="hero-glow"></div>

    <!-- MOTION knob: r=50, cx=cy=60, circ=314.16, full270=235.62 -->
    <!-- default 0.5 → dash=117.81 gap=196.35 → ind 0deg -->
    <div class="knob" id="motion-knob" data-param="motion" data-default="0.5">
      <div class="knob-shell motion-shell">
        <svg class="knob-svg" viewBox="0 0 120 120" width="120" height="120">
          <circle cx="60" cy="60" r="50" fill="none"
                  stroke="rgba(142,91,255,0.14)" stroke-width="5"
                  stroke-dasharray="235.62 9999" stroke-linecap="round"
                  transform="rotate(135 60 60)"/>
          <circle id="arc-motion" cx="60" cy="60" r="50" fill="none"
                  stroke="#8E5BFF" stroke-width="5"
                  stroke-dasharray="117.81 196.35" stroke-linecap="round"
                  transform="rotate(135 60 60)"
                  style="filter:drop-shadow(0 0 5px rgba(142,91,255,0.8))"/>
        </svg>
        <div class="knob-body"></div>
        <div class="knob-indicator" id="ind-motion" style="transform:rotate(0deg)">
          <div class="knob-dot"></div>
        </div>
      </div>
      <span class="hero-value" id="val-motion">50%</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════ MAIN BODY -->
<div id="main-body">

  <!-- ── FILTER ── -->
  <div class="section" id="filter-section">
    <div class="section-header">
      <span class="section-title">Filter</span>
      <div class="pill-group">
        <button class="pill active ftype" data-type="LP">LP</button>
        <button class="pill ftype" data-type="HP">HP</button>
        <button class="pill ftype" data-type="BP">BP</button>
        <button class="pill ftype" data-type="NOTCH">NOTCH</button>
      </div>
    </div>

    <canvas id="filter-canvas" class="display-canvas" height="64"></canvas>

    <div class="knob-row">

      <!-- CUTOFF r=29 circ=182.21 full=136.66 · default 0.6 → dash=82.0 gap=100.21 · ind 27° -->
      <div class="knob" id="cutoff-knob" data-param="cutoff" data-default="0.6">
        <div class="knob-shell std-shell">
          <svg class="knob-svg" viewBox="0 0 72 72" width="72" height="72">
            <circle cx="36" cy="36" r="29" fill="none"
                    stroke="rgba(142,91,255,0.14)" stroke-width="4"
                    stroke-dasharray="136.66 9999" stroke-linecap="round"
                    transform="rotate(135 36 36)"/>
            <circle id="arc-cutoff" cx="36" cy="36" r="29" fill="none"
                    stroke="#8E5BFF" stroke-width="4"
                    stroke-dasharray="82.0 100.21" stroke-linecap="round"
                    transform="rotate(135 36 36)"
                    style="filter:drop-shadow(0 0 4px rgba(142,91,255,0.75))"/>
          </svg>
          <div class="knob-body"></div>
          <div class="knob-indicator" id="ind-cutoff" style="transform:rotate(27deg)">
            <div class="knob-dot"></div>
          </div>
        </div>
        <span class="knob-label">Cutoff</span>
        <span class="knob-value" id="val-cutoff">1.2kHz</span>
      </div>

      <!-- RESONANCE · default 0.3 → dash=41.0 gap=141.21 · ind -54° -->
      <div class="knob" id="resonance-knob" data-param="resonance" data-default="0.3">
        <div class="knob-shell std-shell">
          <svg class="knob-svg" viewBox="0 0 72 72" width="72" height="72">
            <circle cx="36" cy="36" r="29" fill="none"
                    stroke="rgba(142,91,255,0.14)" stroke-width="4"
                    stroke-dasharray="136.66 9999" stroke-linecap="round"
                    transform="rotate(135 36 36)"/>
            <circle id="arc-resonance" cx="36" cy="36" r="29" fill="none"
                    stroke="#8E5BFF" stroke-width="4"
                    stroke-dasharray="41.0 141.21" stroke-linecap="round"
                    transform="rotate(135 36 36)"
                    style="filter:drop-shadow(0 0 4px rgba(142,91,255,0.75))"/>
          </svg>
          <div class="knob-body"></div>
          <div class="knob-indicator" id="ind-resonance" style="transform:rotate(-54deg)">
            <div class="knob-dot"></div>
          </div>
        </div>
        <span class="knob-label">Resonance</span>
        <span class="knob-value" id="val-resonance">30%</span>
      </div>

      <!-- DRIVE · default 0.2 → dash=27.33 gap=154.88 · ind -81° -->
      <div class="knob" id="drive-knob" data-param="drive" data-default="0.2">
        <div class="knob-shell std-shell">
          <svg class="knob-svg" viewBox="0 0 72 72" width="72" height="72">
            <circle cx="36" cy="36" r="29" fill="none"
                    stroke="rgba(142,91,255,0.14)" stroke-width="4"
                    stroke-dasharray="136.66 9999" stroke-linecap="round"
                    transform="rotate(135 36 36)"/>
            <circle id="arc-drive" cx="36" cy="36" r="29" fill="none"
                    stroke="#8E5BFF" stroke-width="4"
                    stroke-dasharray="27.33 154.88" stroke-linecap="round"
                    transform="rotate(135 36 36)"
                    style="filter:drop-shadow(0 0 4px rgba(142,91,255,0.75))"/>
          </svg>
          <div class="knob-body"></div>
          <div class="knob-indicator" id="ind-drive" style="transform:rotate(-81deg)">
            <div class="knob-dot"></div>
          </div>
        </div>
        <span class="knob-label">Drive</span>
        <span class="knob-value" id="val-drive">0 dB</span>
      </div>

    </div>
  </div>

  <!-- ── DELAY ── -->
  <div class="section" id="delay-section">
    <div class="section-header">
      <span class="section-title">Delay</span>
      <div class="pill-group">
        <button class="pill active dmode">STEREO</button>
        <button class="pill dmode">PING PONG</button>
      </div>
    </div>

    <div class="delay-time-row">
      <div class="delay-time-display" id="delay-time-display">1/4</div>
      <button class="sync-btn active" id="delay-sync">SYNC</button>
    </div>

    <canvas id="delay-canvas" class="display-canvas" height="48"></canvas>

    <div class="knob-row">

      <!-- FEEDBACK · default 0.4 → dash=54.66 gap=127.55 · ind -27° -->
      <div class="knob" id="feedback-knob" data-param="feedback" data-default="0.4">
        <div class="knob-shell std-shell">
          <svg class="knob-svg" viewBox="0 0 72 72" width="72" height="72">
            <circle cx="36" cy="36" r="29" fill="none"
                    stroke="rgba(142,91,255,0.14)" stroke-width="4"
                    stroke-dasharray="136.66 9999" stroke-linecap="round"
                    transform="rotate(135 36 36)"/>
            <circle id="arc-feedback" cx="36" cy="36" r="29" fill="none"
                    stroke="#8E5BFF" stroke-width="4"
                    stroke-dasharray="54.66 127.55" stroke-linecap="round"
                    transform="rotate(135 36 36)"
                    style="filter:drop-shadow(0 0 4px rgba(142,91,255,0.75))"/>
          </svg>
          <div class="knob-body"></div>
          <div class="knob-indicator" id="ind-feedback" style="transform:rotate(-27deg)">
            <div class="knob-dot"></div>
          </div>
        </div>
        <span class="knob-label">Feedback</span>
        <span class="knob-value" id="val-feedback">40%</span>
