<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Motion FX</title>
  <style>
    :root {
      --bg:          #111113;
      --panel:       #18181c;
      --panel-edge:  rgba(142, 91, 255, 0.18);
      --purple:      #8E5BFF;
      --purple-soft: #b48aff;
      --purple-glow: rgba(142, 91, 255, 0.45);
      --white:       #f0ecf8;
      --muted:       rgba(200, 190, 220, 0.55);
      --label:       rgba(200, 190, 220, 0.72);
      --ease:        220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: "Avenir Next", "SF Pro Display", "Segoe UI", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { display: flex; align-items: center; justify-content: center; }

    /* ── Plugin shell ───────────────────────────────────────────── */
    .plugin {
      width: min(1400px, 100vw);
      height: min(860px, 100vh);
      background: #111113;
      display: grid;
      grid-template-rows: 72px auto 1fr 56px;
      overflow: hidden;
      position: relative;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid rgba(142, 91, 255, 0.12);
      position: relative;
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo-wrap {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(142, 91, 255, 0.12);
      border: 1px solid rgba(142, 91, 255, 0.28);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-n { width: 22px; height: 22px; object-fit: contain; opacity: 0.9; }

    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-nova {
      font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--purple-soft); font-weight: 600;
    }
    .brand-name {
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--white); font-weight: 700;
    }
    .brand-sub {
      font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); font-weight: 400;
    }

    /* Preset bar center */
    .preset-bar {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid rgba(142, 91, 255, 0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      padding: 6px 10px;
    }
    .preset-arrow {
      background: none; border: none; color: var(--purple-soft);
      font-size: 18px; cursor: pointer; padding: 0 4px; opacity: 0.7;
      transition: opacity var(--ease);
    }
    .preset-arrow:hover { opacity: 1; }
    .preset-name {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--white); min-width: 140px; text-align: center; font-weight: 500;
    }
    .preset-save {
      background: none; border: 1px solid rgba(142,91,255,0.3); border-radius: 5px;
      color: var(--purple-soft); font-size: 10px; letter-spacing: 0.1em;
      padding: 3px 8px; cursor: pointer; text-transform: uppercase; font-family: inherit;
      transition: all var(--ease);
    }
    .preset-save:hover { border-color: var(--purple); color: var(--white); }

    .header-right {
      display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    }
    .power-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: none; border: 1px solid rgba(142,91,255,0.35);
      color: var(--purple-soft); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 14px; transition: all var(--ease);
    }
    .power-btn:hover, .power-btn.on {
      background: rgba(142,91,255,0.18); border-color: var(--purple);
      color: var(--purple-soft);
      box-shadow: 0 0 14px var(--purple-glow);
    }

    /* ── HERO — MOTION KNOB ─────────────────────────────────────── */
    .hero {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 18px 0 12px;
      position: relative;
    }

    .motion-halo {
      position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(142,91,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: halo-pulse 3s ease-in-out infinite;
    }
    @keyframes halo-pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    .motion-knob-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative; z-index: 2;
    }
    .motion-label {
      font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--purple-soft); font-weight: 600;
    }
    .motion-knob {
      width: 120px; height: 120px;
      cursor: ns-resize; touch-action: none; user-select: none;
    }
    .motion-knob svg { width: 100%; height: 100%; overflow: visible; }

    .motion-value {
      font-size: 12px; color: var(--muted); letter-spacing: 0.08em;
    }

    /* ── MAIN BODY ──────────────────────────────────────────────── */
    .body {
      display: grid;
      grid-template-columns: 1fr 2px 1fr 2px 1fr;
      gap: 0;
      padding: 0 28px;
      overflow: hidden;
    }

    .divider {
      background: linear-gradient(180deg, transparent, rgba(142,91,255,0.15), transparent);
      margin: 16px 0;
    }

    /* ── SECTION CARD ───────────────────────────────────────────── */
    .section {
      padding: 0 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-title {
      font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--purple-soft); font-weight: 600;
    }
    .section-toggle {
      width: 28px; height: 16px; border-radius: 8px;
      background: rgba(142,91,255,0.2); border: 1px solid rgba(142,91,255,0.3);
      position: relative; cursor: pointer; transition: background var(--ease);
    }
    .section-toggle.on { background: var(--purple); }
    .section-toggle::after {
      content: ""; position: absolute;
      width: 10px; height: 10px; border-radius: 50%;
      background: white; top: 2px; left: 2px;
      transition: transform var(--ease);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .section-toggle.on::after { transform: translateX(12px); }

    /* ── KNOB ROW ───────────────────────────────────────────────── */
    .knob-row {
      display: flex; justify-content: space-around; align-items: flex-start;
      gap: 8px;
    }

    .knob-group {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      flex: 1;
    }
    .knob-lbl {
      font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--label); font-weight: 500;
    }
    .knob {
      width: clamp(48px, 4.2vw, 68px);
      height: clamp(48px, 4.2vw, 68px);
      cursor: ns-resize; touch-action: none; user-select: none;
    }
    .knob svg { width: 100%; height: 100%; overflow: visible; }
    .knob-val {
      font-size: 9px; color: var(--muted); letter-spacing: 0.05em;
      text-align: center;
    }

    /* ── FILTER CURVE ───────────────────────────────────────────── */
    .filter-viz {
      height: 72px;
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(142,91,255,0.1);
      overflow: hidden; position: relative;
    }
    .filter-viz canvas { width: 100%; height: 100%; display: block; }

    /* ── FILTER TYPE PILLS ──────────────────────────────────────── */
    .filter-types {
      display: flex; gap: 6px;
    }
    .ftype {
      flex: 1; padding: 5px 0; text-align: center;
      font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
      border: 1px solid rgba(142,91,255,0.18); border-radius: 5px;
      background: none; color: var(--label); cursor: pointer;
      font-family: inherit; transition: all var(--ease);
    }
    .ftype.active, .ftype:hover {
      border-color: var(--purple); color: var(--purple-soft);
      background: rgba(142,91,255,0.1);
    }

    /* ── DELAY WAVEFORM ─────────────────────────────────────────── */
    .delay-viz {
      height: 72px; border-radius: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(142,91,255,0.1);
      overflow: hidden;
    }
    .delay-viz canvas { width: 100%; height: 100%; display: block; }

    .delay-time-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .delay-time-display {
      font-size: 22px; font-weight: 700; color: var(--white);
      letter-spacing: 0.04em;
    }
    .delay-sync-btn {
      font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
      background: none; border: 1px solid rgba(142,91,255,0.3); border-radius: 4px;
      color: var(--purple-soft); padding: 2px 8px; cursor: pointer;
      font-family: inherit; transition: all var(--ease);
    }
    .delay-sync-btn.active {
      background: rgba(142,91,255,0.18); border-color: var(--purple);
    }

    .delay-mode-row { display: flex; gap: 6px; }
    .dmode {
      flex: 1; padding: 5px 0; text-align: center;
      font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(142,91,255,0.18); border-radius: 5px;
      background: none; color: var(--label); cursor: pointer; font-family: inherit;
      transition: all var(--ease);
    }
    .dmode.active, .dmode:hover {
      border-color: var(--purple); color: var(--purple-soft);
      background: rgba(142,91,255,0.1);
    }

    /* ── REVERB EQ ──────────────────────────────────────────────── */
    .reverb-eq {
      flex: 1; border-radius: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(142,91,255,0.1);
      overflow: hidden; position: relative; min-height: 80px;
    }
    .reverb-eq canvas { width: 100%; height: 100%; display: block; }

    .reverb-freeze {
      display: flex; align-items: center; gap: 8px;
    }
    .freeze-btn {
      padding: 5px 14px; border-radius: 5px;
      border: 1px solid rgba(142,91,255,0.3);
      background: none; color: var(--label); cursor: pointer;
      font-family: inherit; font-size: 9px; letter-spacing: 0.18em;
      text-transform: uppercase; transition: all var(--ease);
    }
    .freeze-btn.active {
      background: rgba(142,91,255,0.22); border-color: var(--purple);
      color: var(--purple-soft);
      box-shadow: 0 0 12px var(--purple-glow);
    }

    .reverb-type-row { display: flex; gap: 6px; }
    .rtype {
      flex: 1; padding: 5px 0; text-align: center;
      font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase;
      border: 1px solid rgba(142,91,255,0.18); border-radius: 5px;
      background: none; color: var(--label); cursor: pointer; font-family: inherit;
      transition: all var(--ease);
    }
    .rtype.active, .rtype:hover {
      border-color: var(--purple); color: var(--purple-soft);
      background: rgba(142,91,255,0.1);
    }

    /* ── BOTTOM STRIP ───────────────────────────────────────────── */
    .bottom-strip {
      display: grid;
      grid-template-columns: 1fr 2px 1fr 2px 1fr;
      border-top: 1px solid rgba(142,91,255,0.1);
      padding: 0 28px;
    }

    .strip-divider {
      background: rgba(142,91,255,0.1);
      margin: 8px 0;
    }

    .strip-section {
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
    }

    .strip-label {
      font-size: 8px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--purple-soft); font-weight: 600; white-space: nowrap;
    }

    /* LFO strip */
    .lfo-target {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(142,91,255,0.2);
      border-radius: 5px; color: var(--label); font-family: inherit;
      font-size: 9px; letter-spacing: 0.1em; padding: 4px 8px; cursor: pointer;
      min-width: 80px;
    }
    .lfo-wave-mini { flex: 1; height: 24px; min-width: 60px; }
    .lfo-wave-mini canvas { width: 100%; height: 100%; display: block; }

    .mini-knob-group {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .mini-knob {
      width: 36px; height: 36px;
      cursor: ns-resize; touch-action: none; user-select: none;
    }
    .mini-knob svg { width: 100%; height: 100%; overflow: visible; }
    .mini-lbl {
      font-size: 7px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--label);
    }
    .mini-val { font-size: 8px; color: var(--muted); }

    /* Master strip */
    .meter-wrap {
      display: flex; gap: 3px; align-items: flex-end; height: 32px;
    }
    .meter-bar {
      width: 8px; border-radius: 2px 2px 0 0;
      background: rgba(142,91,255,0.15);
      border: 1px solid rgba(142,91,255,0.2);
      position: relative; overflow: hidden; height: 100%;
    }
    .meter-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, #8E5BFF, #b48aff, #d4b0ff);
      border-radius: 1px 1px 0 0;
      transition: height 0.05s linear;
      box-shadow: 0 0 8px var(--purple-glow);
    }

    /* bottom bar */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 28px;
      border-top: 1px solid rgba(142,91,255,0.08);
      background: rgba(0,0,0,0.3);
    }
    .bottom-bar-left, .bottom-bar-right {
      display: flex; align-items: center; gap: 12px;
    }
    .bar-control {
      display: flex; align-items: center; gap: 5px;
    }
    .bar-label {
      font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }
    .bar-select {
      background: none; border: none; color: var(--label);
      font-size: 8px; font-family: inherit; cursor: pointer; padding: 0;
    }
    .bar-pill {
      padding: 2px 8px; border-radius: 3px;
      border: 1px solid rgba(142,91,255,0.2); background: rgba(142,91,255,0.08);
      color: var(--purple-soft); font-size: 8px; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer; font-family: inherit;
      transition: all var(--ease);
    }
    .bar-pill:hover { border-color: var(--purple); color: var(--white); }
    .bar-pill.on {
      background: rgba(142,91,255,0.22); border-color: var(--purple);
    }
  </style>
</head>
<body>
<div class="plugin" id="plugin">

  <!-- ── HEADER ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="brand">
      <div class="logo-wrap">
        <img src="n_logo.png" alt="N" class="logo-n" />
      </div>
      <div class="brand-text">
        <span class="brand-nova">NOVA AUDIO</span>
        <span class="brand-name">MOTION FX</span>
        <span class="brand-sub">FILTER · DELAY · REVERB</span>
      </div>
    </div>

    <div class="preset-bar">
      <button class="preset-arrow" id="preset-prev">‹</button>
      <span class="preset-name" id="preset-name">CITRUS SPLASH</span>
      <button class="preset-arrow" id="preset-next">›</button>
      <button class="preset-save">SAVE</button>
    </div>

    <div class="header-right">
      <button class="power-btn on" id="power-btn">⏻</button>
    </div>
  </header>

  <!-- ── HERO — MOTION KNOB ──────────────────────────────────────── -->
  <div class="hero">
    <div class="motion-halo"></div>
    <div class="motion-knob-wrap">
      <span class="motion-label">MOTION</span>
      <div class="motion-knob" id="motion-knob" data-param="motion" data-default="50" tabindex="-1">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="motion-body" cx="34%" cy="28%" r="78%">
              <stop offset="0%" stop-color="#e0d0ff" stop-opacity="0.45"/>
              <stop offset="30%" stop-color="#2a1f50" stop-opacity="0.55"/>
              <stop offset="80%" stop-color="#0d0920" stop-opacity="0.98"/>
              <stop offset="100%" stop-color="#080614" stop-opacity="1"/>
            </radialGradient>
            <filter id="motion-glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Track -->
          <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(142,91,255,0.15)"
                  stroke-width="6" stroke-dasharray="193 9999" stroke-linecap="round"
                  transform="rotate(135 60 60)"/>
          <!-- Active arc -->
          <circle cx="60" cy="60" r="46" id="motion-arc" fill="none"
                  stroke="url(#motion-grad)" stroke-width="6"
                  stroke-dasharray="0 193" stroke-linecap="round"
                  transform="rotate(135 60 60)"
                  style="filter:drop-shadow(0 0 8px rgba(142,91,255,0.9));"/>
          <defs>
            <linearGradient id="motion-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8E5BFF"/>
              <stop offset="100%" stop-color="#c48aff"/>
            </linearGradient>
          </defs>
          <!-- Body -->
          <circle cx="60" cy="60" r="38" fill="url(#motion-body)"
                  stroke="rgba(220,200,255,0.22)" stroke-width="1.2"/>
          <!-- Sheen -->
          <ellipse cx="50" cy="42" rx="22" ry="13" fill="rgba(255,255,255,0.2)"/>
          <!-- Indicator -->
          <g id="motion-ind" style="transform-origin:60px 60px;transform:rotate(-135deg)">
            <rect x="57.5" y="14" width="5" height="16" rx="2" fill="#c48aff"/>
          </g>
        </svg>
      </div>
      <span class="motion-value" id="motion-value">50%</span>
    </div>
  </div>

  <!-- ── MAIN BODY ───────────────────────────────────────────────── -->
  <div class="body">

    <!-- FILTER -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">FILTER</span>
        <div class="section-toggle on" id="filter-toggle"></div>
      </div>

      <div class="filter-types">
        <button class="ftype active" data-ftype="LP">LP</button>
        <button class="ftype"        data-ftype="HP">HP</button>
        <button class="ftype"        data-ftype="BP">BP</button>
        <button class="ftype"        data-ftype="NT">NOTCH</button>
      </div>

      <div class="knob-row">
        <div class="knob-group">
          <span class="knob-lbl">CUTOFF</span>
          <div class="knob" id="cutoff-knob" data-param="cutoff" data-default="60" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="cutoff"/></svg>
          </div>
          <span class="knob-val" id="cutoff-value">2.45 kHz</span>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">RESONANCE</span>
          <div class="knob" id="resonance-knob" data-param="resonance" data-default="35" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="resonance"/></svg>
          </div>
          <span class="knob-val" id="resonance-value">35%</span>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">DRIVE</span>
          <div class="knob" id="drive-knob" data-param="drive" data-default="22" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="drive"/></svg>
          </div>
          <span class="knob-val" id="drive-value">22%</span>
        </div>
      </div>

      <div class="filter-viz">
        <canvas id="filter-canvas"></canvas>
      </div>
    </div>

    <div class="divider"></div>

    <!-- DELAY -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">DELAY</span>
        <div class="section-toggle on" id="delay-toggle"></div>
      </div>

      <div class="knob-row" style="align-items:center;">
        <div class="delay-time-wrap">
          <span class="delay-time-display" id="delay-time-display">1/4</span>
          <button class="delay-sync-btn active" id="delay-sync">SYNC</button>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">FEEDBACK</span>
          <div class="knob" id="feedback-knob" data-param="feedback" data-default="35" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="feedback"/></svg>
          </div>
          <span class="knob-val" id="feedback-value">35%</span>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">MIX</span>
          <div class="knob" id="delay-mix-knob" data-param="delay_mix" data-default="40" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="delay_mix"/></svg>
          </div>
          <span class="knob-val" id="delay_mix-value">40%</span>
        </div>
      </div>

      <div class="delay-viz">
        <canvas id="delay-canvas"></canvas>
      </div>

      <div class="delay-mode-row">
        <button class="dmode" data-dmode="STEREO">STEREO</button>
        <button class="dmode active" data-dmode="PING PONG">PING PONG</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- REVERB -->
    <div class="section" style="display:flex;flex-direction:column;gap:12px;">
      <div class="section-header">
        <span class="section-title">REVERB</span>
        <div class="section-toggle on" id="reverb-toggle"></div>
      </div>

      <div class="knob-row">
        <div class="knob-group">
          <span class="knob-lbl">SIZE</span>
          <div class="knob" id="size-knob" data-param="size" data-default="60" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="size"/></svg>
          </div>
          <span class="knob-val" id="size-value">60%</span>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">DECAY</span>
          <div class="knob" id="decay-knob" data-param="decay" data-default="55" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="decay"/></svg>
          </div>
          <span class="knob-val" id="decay-value">2.85 s</span>
        </div>
        <div class="knob-group">
          <span class="knob-lbl">MIX</span>
          <div class="knob" id="reverb-mix-knob" data-param="reverb_mix" data-default="35" tabindex="-1">
            <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#knob-def" data-id="reverb_mix"/></svg>
          </div>
          <span class="knob-val" id="reverb_mix-value">35%</span>
        </div>
        <div class="knob-group" style="justify-content:flex-end;padding-top:18px;">
          <button class="freeze-btn" id="freeze-btn">❄ FREEZE</button>
        </div>
      </div>

      <div class="reverb-type-row">
        <button class="rtype active" data-rtype="STUDIO">STUDIO</button>
        <button class="rtype"        data-rtype="HALL">HALL</button>
        <button class="rtype"        data-rtype="PLATE">PLATE</button>
      </div>

      <div class="reverb-eq" style="flex:1;">
        <canvas id="reverb-eq-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM STRIP ───────────────────────────────────────────── -->
  <div class="bottom-strip">

    <!-- LFO -->
    <div class="strip-section">
      <span class="strip-label">LFO</span>
      <select class="lfo-target" id="lfo-target">
        <option>CUTOFF</option>
        <option>REVERB MIX</option>
        <option>DELAY MIX</option>
        <option>MOTION</option>
      </select>
      <div class="mini-knob-group">
        <span class="mini-lbl">RATE</span>
        <div class="mini-knob" id="lfo-rate-knob" data-param="lfo_rate" data-default="50" tabindex="-1">
          <svg viewBox="0 0 36 36" aria-hidden="true"><use href="#mini-knob-def" data-id="lfo_rate"/></svg>
        </div>
        <span class="mini-val" id="lfo_rate-value">1/4</span>
      </div>
      <div class="mini-knob-group">
        <span class="mini-lbl">DEPTH</span>
        <div class="mini-knob" id="lfo-depth-knob" data-param="lfo_depth" data-default="75" tabindex="-1">
          <svg viewBox="0 0 36 36" aria-hidden="true"><use href="#mini-knob-def" data-id="lfo_depth"/></svg>
        </div>
        <span class="mini-val" id="lfo_depth-value">75%</span>
      </div>
      <div class="lfo-wave-mini">
        <canvas id="lfo-canvas"></canvas>
      </div>
    </div>

    <div class="strip-divider"></div>

    <!-- empty middle (spacer) -->
    <div class="strip-section" style="justify-content:center;">
    </div>

    <div class="strip-divider"></div>

    <!-- MASTER -->
    <div class="strip-section" style="gap:16px;">
      <span class="strip-label">MASTER</span>
      <div class="mini-knob-group">
        <span class="mini-lbl">INPUT</span>
        <div class="mini-knob" id="input-knob" data-param="input" data-default="50" tabindex="-1">
          <svg viewBox="0 0 36 36" aria-hidden="true"><use href="#mini-knob-def" data-id="input"/></svg>
        </div>
        <span class="mini-val" id="input-value">0 dB</span>
      </div>
      <div class="mini-knob-group">
        <span class="mini-lbl">OUTPUT</span>
        <div class="mini-knob" id="output-knob" data-param="output" data-default="50" tabindex="-1">
          <svg viewBox="0 0 36 36" aria-hidden="true"><use href="#mini-knob-def" data-id="output"/></svg>
        </div>
        <span class="mini-val" id="output-value">0 dB</span>
      </div>
      <div class="mini-knob-group">
        <span class="mini-lbl">DRY/WET</span>
        <div class="mini-knob" id="mix-knob" data-param="mix" data-default="100" tabindex="-1">
          <svg viewBox="0 0 36 36" aria-hidden="true"><use href="#mini-knob-def" data-id="mix"/></svg>
        </div>
        <span class="mini-val" id="mix-value">100%</span>
      </div>
      <div class="meter-wrap" id="meter-wrap">
        <div class="meter-bar"><div class="meter-fill" id="meter-l" style="height:0%"></div></div>
        <div class="meter-bar"><div class="meter-fill" id="meter-r" style="height:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM BAR ─────────────────────────────────────────────── -->
  <div class="bottom-bar">
    <div class="bottom-bar-left">
      <div class="bar-control">
        <span class="bar-label">HQ</span>
        <button class="bar-pill on" id="hq-btn">ON</button>
      </div>
      <div class="bar-control">
        <span class="bar-label">OVERSAMPLE</span>
        <select class="bar-select" id="os-select">
          <option>1x</option><option selected>2x</option><option>4x</option>
        </select>
      </div>
    </div>
    <div class="bottom-bar-right">
      <button class="bar-pill" id="undo-btn">UNDO</button>
      <button class="bar-pill" id="redo-btn">REDO</button>
      <button class="bar-pill" id="help-btn">HELP</button>
    </div>
  </div>

  <!-- ── SVG DEFS (knob templates rendered by JS) ───────────────── -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <radialGradient id="knob-body-grad" cx="34%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#d8c8f8" stop-opacity="0.38"/>
        <stop offset="28%" stop-color="#261a46" stop-opacity="0.5"/>
        <stop offset="80%" stop-color="#0d0920" stop-opacity="0.98"/>
        <stop offset="100%" stop-color="#080614" stop-opacity="1"/>
      </radialGradient>
      <linearGradient id="knob-arc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8E5BFF"/>
        <stop offset="100%" stop-color="#c48aff"/>
      </linearGradient>
    </defs>
  </svg>

</div>

<script src="js/index.js?v=20260711-1"></script>
</body>
</html>
