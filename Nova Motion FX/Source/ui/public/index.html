<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1100"/>
<title>Nova Motion FX</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #111113;
  --panel: #18181c;
  --panel2: #1c1c22;
  --border: rgba(142,91,255,0.18);
  --purple: #8E5BFF;
  --purple-soft: #b48aff;
  --purple-light: #c48aff;
  --text: #f0ecf8;
  --muted: rgba(200,190,220,0.55);
  --pill-bg: rgba(142,91,255,0.1);
  --pill-active: rgba(142,91,255,0.35);
}

html, body {
  width: 1100px;
  height: 700px;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  user-select: none;
  -webkit-user-select: none;
}

/* ─── LAYOUT ─────────────────────────────────────── */
#root {
  display: flex;
  flex-direction: column;
  width: 1100px;
  height: 700px;
}

/* ─── HEADER ─────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 20px;
  background: #0d0d10;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

#logo-img {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

.logo-fallback {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8E5BFF, #c48aff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  color: #fff;
  letter-spacing: -1px;
  flex-shrink: 0;
}

.title-block { display: flex; flex-direction: column; gap: 1px; }
.plugin-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text);
}
.plugin-sub {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--muted);
}

/* Preset bar */
.preset-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
}
.preset-arrow {
  background: none; border: none; color: var(--purple-soft);
  cursor: pointer; font-size: 14px; padding: 0 2px;
  line-height: 1;
}
.preset-arrow:hover { color: var(--text); }
.preset-name {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text);
  min-width: 110px;
  text-align: center;
}
.preset-save {
  background: rgba(142,91,255,0.2);
  border: 1px solid rgba(142,91,255,0.4);
  border-radius: 10px;
  color: var(--purple-light);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 2px 8px;
  cursor: pointer;
}
.preset-save:hover { background: rgba(142,91,255,0.35); }

.header-right { display: flex; align-items: center; gap: 10px; }
.power-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(142,91,255,0.12);
  border: 1px solid rgba(142,91,255,0.3);
  color: var(--purple-soft);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.power-btn:hover { background: rgba(142,91,255,0.25); color: var(--text); }

/* ─── HERO ───────────────────────────────────────── */
#hero {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  height: 168px;
  background: radial-gradient(ellipse 320px 120px at 50% 100%, rgba(142,91,255,0.12) 0%, transparent 70%);
  position: relative;
}

.hero-label {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.32em;
  color: var(--purple-soft);
  text-transform: uppercase;
  white-space: nowrap;
}

.hero-knob-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
}

.hero-glow {
  position: absolute;
  width: 144px; height: 144px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(142,91,255,0.28) 0%, rgba(142,91,255,0.08) 55%, transparent 75%);
  pointer-events: none;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

.hero-value {
  font-size: 11px;
  font-weight: 600;
  color: var(--purple-light);
  margin-top: 2px;
  text-align: center;
}

/* ─── MAIN BODY ──────────────────────────────────── */
#main-body {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
  flex: 1;
  min-height: 0;
  border-top: 1px solid var(--border);
}

.section {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px 14px 10px;
  gap: 8px;
  overflow: hidden;
}
.section:last-child { border-right: none; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.section-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--purple-soft);
  text-transform: uppercase;
}

/* Pill group */
.pill-group {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
}
.pill {
  background: var(--pill-bg);
  border: 1px solid rgba(142,91,255,0.2);
  border-radius: 10px;
  color: var(--muted);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  cursor: pointer;
  white-space: nowrap;
}
.pill.active, .pill:hover {
  background: var(--pill-active);
  border-color: rgba(142,91,255,0.55);
  color: var(--text);
}

/* Knob row */
.knob-row {
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

/* Standard knob */
.knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: ns-resize;
}
.knob svg { overflow: visible; display: block; }
.knob-label {
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  text-align: center;
}
.knob-value {
  font-size: 8px;
  color: var(--purple-light);
  min-width: 28px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.mini-knob {
  cursor: ns-resize;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.mini-knob svg { overflow: visible; display: block; }

/* Canvas displays */
.display-canvas {
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(142,91,255,0.12);
  border-radius: 5px;
  width: 100%;
  height: 70px;
  display: block;
  flex-shrink: 0;
}

/* Delay section */
.delay-time-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.delay-time-display {
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(142,91,255,0.2);
  border-radius: 5px;
  padding: 4px 12px;
  font-size: 16px;
  font-weight: 700;
  color: var(--purple-light);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}
.sync-btn {
  background: rgba(142,91,255,0.15);
  border: 1px solid rgba(142,91,255,0.35);
  border-radius: 5px;
  color: var(--purple-soft);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  cursor: pointer;
}
.sync-btn.active, .sync-btn:hover {
  background: rgba(142,91,255,0.32);
  color: var(--text);
}

/* Reverb */
.freeze-btn {
  background: rgba(142,91,255,0.1);
  border: 1px solid rgba(142,91,255,0.3);
  border-radius: 5px;
  color: var(--purple-soft);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 3px 10px;
  cursor: pointer;
}
.freeze-btn:hover, .freeze-btn.active {
  background: rgba(142,91,255,0.35);
  color: var(--text);
  border-color: var(--purple);
}

/* ─── BOTTOM ROW ─────────────────────────────────── */
#bottom-row {
  display: flex;
  height: 106px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--panel2);
}

#lfo-section {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 8px 14px 8px;
  gap: 5px;
  border-right: 1px solid var(--border);
}

#master-section {
  display: flex;
  flex-direction: column;
  width: 218px;
  flex-shrink: 0;
  padding: 8px 12px 8px;
  gap: 6px;
}

.bottom-section-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--purple-soft);
  text-transform: uppercase;
  flex-shrink: 0;
}

.lfo-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-height: 0;
}

.lfo-target-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.lfo-target-label {
  font-size: 8px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.lfo-target-select {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 9px;
  padding: 3px 6px;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
}

.mini-knob-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}

#lfo-canvas {
  flex: 1;
  min-width: 0;
  height: 52px;
  border-radius: 5px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(142,91,255,0.12);
  display: block;
}

/* Meter */
.meter-group {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  flex-shrink: 0;
  margin-left: 6px;
}
.meter-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.meter-ch-label {
  font-size: 7px;
  color: var(--muted);
  letter-spacing: 0.06em;
}
.meter-track {
  width: 8px;
  height: 44px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(142,91,255,0.15);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.meter-bar {
  width: 100%;
  background: linear-gradient(to top, #8E5BFF, #c48aff);
  border-radius: 3px;
}

.master-controls {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

/* ─── BOTTOM BAR ─────────────────────────────────── */
#bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 28px;
  padding: 0 16px;
  background: #0a0a0d;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.bottom-bar-left, .bottom-bar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bar-label {
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.bar-toggle {
  background: rgba(142,91,255,0.18);
  border: 1px solid rgba(142,91,255,0.3);
  border-radius: 8px;
  color: var(--purple-soft);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 2px 8px;
  cursor: pointer;
}
.bar-toggle.active { background: rgba(142,91,255,0.4); color: var(--text); }
.bar-select {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 8.5px;
  padding: 2px 5px;
  outline: none;
  cursor: pointer;
  -webkit-appearance: none;
}
.bar-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 5px;
  color: var(--muted);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  cursor: pointer;
}
.bar-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

.h-divider {
  width: 1px;
  height: 14px;
  background: var(--border);
}
</style>
</head>
<body>
<div id="root">

  <!-- ══════════════════════════════════════════════ HEADER -->
  <div id="header">
    <div class="header-left">
      <img id="logo-img" src="n_logo.png" alt="Nova Audio"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"/>
      <div class="logo-fallback" id="logo-fallback" style="display:none">N</div>
      <div class="title-block">
        <span class="plugin-name">NOVA AUDIO</span>
        <span class="plugin-sub">NOVA MOTION FX &nbsp;·&nbsp; FILTER · DELAY · REVERB</span>
      </div>
    </div>

    <div class="preset-bar">
      <button class="preset-arrow" id="prev-preset">&#8249;</button>
      <span class="preset-name" id="preset-name">CITRUS SPLASH</span>
      <button class="preset-arrow" id="next-preset">&#8250;</button>
      <button class="preset-save" id="save-preset">SAVE</button>
    </div>

    <div class="header-right">
      <button class="power-btn" id="power-btn">&#9211;</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════ HERO -->
  <div id="hero">
    <span class="hero-label">MOTION</span>
    <div class="hero-knob-wrap">
      <div class="hero-glow"></div>

      <!--
        MOTION knob: large, r=46, viewBox 120x120
        circ = 2*PI*46 = 289.03
        full = 289.03 * 270/360 = 216.77
        default = 0.5 → dash = 108.39, gap = 289.03 - 108.39 = 180.64
        indicator default rotation = -135 + 0.5*270 = 0 deg
      -->
      <div class="knob" id="motion-knob" data-param="motion" data-default="0.5">
        <svg viewBox="0 0 120 120" width="120" height="120" style="overflow:visible;display:block;">
          <circle class="knob-track" cx="60" cy="60" r="46" fill="none"
                  stroke="rgba(142,91,255,0.15)" stroke-width="7"
                  stroke-dasharray="216.77 9999" stroke-linecap="round"
                  transform="rotate(135 60 60)"/>
          <circle class="knob-arc" id="arc-motion" cx="60" cy="60" r="46" fill="none"
                  stroke="url(#arc-grad)" stroke-width="7"
                  stroke-dasharray="108.39 180.64" stroke-linecap="round"
                  transform="rotate(135 60 60)"/>
          <circle cx="60" cy="60" r="39" fill="url(#knob-body)"
                  stroke="rgba(220,200,255,0.18)" stroke-width="1.5"/>
          <ellipse cx="48" cy="39" rx="22" ry="14" fill="rgba(255,255,255,0.18)"/>
          <g id="ind-motion" style="transform-origin:60px 60px;transform:rotate(0deg)">
            <rect x="58" y="10" width="4" height="14" rx="2" fill="#c48aff"/>
          </g>
        </svg>
        <span class="hero-value" id="val-motion">50%</span>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════ MAIN BODY -->
  <div id="main-body">

    <!-- ── FILTER ── -->
    <div class="section" id="filter-section">
      <div class="section-header">
        <span class="section-title">Filter</span>
        <div class="pill-group" id="filter-type">
          <button class="pill active" data-type="LP">LP</button>
          <button class="pill" data-type="HP">HP</button>
          <button class="pill" data-type="BP">BP</button>
          <button class="pill" data-type="NOT">NOTCH</button>
        </div>
      </div>

      <canvas id="filter-canvas" class="display-canvas" width="320" height="70"></canvas>

      <div class="knob-row">

        <!--
          CUTOFF: r=32, circ=201.06, full=134.04
          default=0.6 → dash=80.42, gap=120.64
          indicator: -135 + 0.6*270 = 27 deg
        -->
        <div class="knob" id="cutoff-knob" data-param="cutoff" data-default="0.6">
          <svg viewBox="0 0 80 80" width="72" height="72">
            <circle class="knob-track" cx="40" cy="40" r="32" fill="none"
                    stroke="rgba(142,91,255,0.15)" stroke-width="5"
                    stroke-dasharray="134.04 9999" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle class="knob-arc" id="arc-cutoff" cx="40" cy="40" r="32" fill="none"
                    stroke="url(#arc-grad)" stroke-width="5"
                    stroke-dasharray="80.42 120.64" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle cx="40" cy="40" r="27" fill="url(#knob-body)"
                    stroke="rgba(220,200,255,0.18)" stroke-width="1"/>
            <ellipse cx="32" cy="26" rx="16" ry="10" fill="rgba(255,255,255,0.18)"/>
            <g id="ind-cutoff" style="transform-origin:40px 40px;transform:rotate(27deg)">
              <rect x="38.5" y="8" width="3" height="9" rx="1.5" fill="#c48aff"/>
            </g>
          </svg>
          <span class="knob-label">Cutoff</span>
          <span class="knob-value" id="val-cutoff">1.2k</span>
        </div>

        <!--
          RESONANCE: default=0.3 → dash=40.21, gap=160.85
          indicator: -135 + 0.3*270 = -54 deg
        -->
        <div class="knob" id="resonance-knob" data-param="resonance" data-default="0.3">
          <svg viewBox="0 0 80 80" width="72" height="72">
            <circle class="knob-track" cx="40" cy="40" r="32" fill="none"
                    stroke="rgba(142,91,255,0.15)" stroke-width="5"
                    stroke-dasharray="134.04 9999" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle class="knob-arc" id="arc-resonance" cx="40" cy="40" r="32" fill="none"
                    stroke="url(#arc-grad)" stroke-width="5"
                    stroke-dasharray="40.21 160.85" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle cx="40" cy="40" r="27" fill="url(#knob-body)"
                    stroke="rgba(220,200,255,0.18)" stroke-width="1"/>
            <ellipse cx="32" cy="26" rx="16" ry="10" fill="rgba(255,255,255,0.18)"/>
            <g id="ind-resonance" style="transform-origin:40px 40px;transform:rotate(-54deg)">
              <rect x="38.5" y="8" width="3" height="9" rx="1.5" fill="#c48aff"/>
            </g>
          </svg>
          <span class="knob-label">Resonance</span>
          <span class="knob-value" id="val-resonance">30%</span>
        </div>

        <!--
          DRIVE: default=0.2 → dash=26.81, gap=174.25
          indicator: -135 + 0.2*270 = -81 deg
        -->
        <div class="knob" id="drive-knob" data-param="drive" data-default="0.2">
          <svg viewBox="0 0 80 80" width="72" height="72">
            <circle class="knob-track" cx="40" cy="40" r="32" fill="none"
                    stroke="rgba(142,91,255,0.15)" stroke-width="5"
                    stroke-dasharray="134.04 9999" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle class="knob-arc" id="arc-drive" cx="40" cy="40" r="32" fill="none"
                    stroke="url(#arc-grad)" stroke-width="5"
                    stroke-dasharray="26.81 174.25" stroke-linecap="round"
                    transform="rotate(135 40 40)"/>
            <circle cx="40" cy="40" r="27" fill="url(#knob-body)"
                    stroke="rgba(220,200,255,0.18)" stroke-width="1"/>
            <ellipse cx="32" cy="26" rx="16" ry="10" fill="rgba(255,255,255,0.18)"/>
            <g id="ind-drive" style="transform-origin:40px 40px;transform:rotate(-81deg)">
              <rect x="38.5" y="8" width="3" height="9" rx="1.5" fill="#c48aff"/>
            </g>
          </svg>
          <span class="knob-label">Drive</span>
          <span class="knob-value" id="val-drive">0 dB</span>
        </div>

      </div>
    </div>

    <!-- ── DELAY ── -->
    <div class="section" id="delay-section">
      <div class="section-header">
        <span class="section-title">Delay</span>
        <div class="pill-group" id="delay-mode">
          <button class="pill active" data-mode="stereo">STEREO</button>
          <button class="pill" data-mode="ping">PING PONG</button>
        </div>
      </div>

      <div class="delay-time-row">
        <div class="delay-time-display" id="delay-time-display">1/4</div>
        <button class="sync-btn active" id="delay-sync">SYNC</button>
      </div>

      <canvas id="delay-canvas" class="display-canvas" width="320" height="52" style="height:52px;"></canvas>

      <div class="knob-row">

        <!--
          FEEDBACK: default=0.4 → dash=53.62, gap=147.44
          indicator: -135 + 0.4*270 = -27 deg
        -->
        <div class="knob" id="feedback-knob" data-param="feedback" data-default="0.4">
          <svg viewBox="0 0 80 80" width="72" height="72">
            <circle class="knob-track" cx="40" cy="40" r="32" fill="none"
                    stroke="rgba(142,91,255,0.15)" stroke-width="5"
