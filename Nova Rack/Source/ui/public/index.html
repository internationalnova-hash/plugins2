<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Rack</title>
  <style>
    :root {
      --accent: #ff9836;
      --accent-soft: #ffb766;
      --text-main: #eaeaea;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      --ease: 180ms cubic-bezier(0.22, 1, 0.36, 1);
      --mod-w: 228px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050709;
      font-family: var(--sans); color: var(--text-main);
      user-select: none; -webkit-user-select: none;
    }
    body { display: grid; place-items: center; }
    button { font-family: inherit; white-space: nowrap; }

    /* The whole rack is designed at 1240 x 720 and scaled to fit the window. */
    .app {
      position: relative; width: 1240px; height: 720px; transform-origin: center center; flex: none;
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #0e1116 0%, #0a0c10 100%);
    }

    /* ── Top bar ─────────────────────────────────────── */
    .topbar {
      flex: 0 0 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: linear-gradient(180deg, #1a1e24, #121519);
      border-bottom: 1px solid #000; box-shadow: inset 0 -1px 0 rgba(255,255,255,0.04);
    }
    .hamb { width: 34px; height: 30px; border-radius: 7px; border: 1px solid #2a3038; background: #15191e; color: #c9ced6; font-size: 16px; cursor: pointer; }
    .hamb:hover { border-color: rgba(255,152,54,0.6); }
    .brand { display: flex; align-items: center; gap: 8px; width: 200px; }
    .brand img { width: 24px; height: 24px; opacity: 0.92; }
    .brand b { font-family: var(--serif); font-size: 19px; font-weight: 900; letter-spacing: 0.06em; }
    .brand span { font-family: var(--serif); font-size: 19px; font-weight: 400; letter-spacing: 0.06em; color: #a9b0ba; }

    .preset { display: flex; align-items: stretch; height: 32px; margin: 0 auto; border: 1px solid #2a3038; border-radius: 7px; overflow: hidden; background: #0b0e12; }
    .preset button { border: 0; background: #161a20; color: #aab2bd; width: 30px; cursor: pointer; font-size: 10px; }
    .preset button:hover { color: #fff; background: #1d232b; }
    .preset .name { width: 300px; background: #0b0e12; color: #f0f0f0; font-size: 13.5px; font-weight: 600;
                    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; cursor: pointer;
                    border-left: 1px solid #222830; border-right: 1px solid #222830; overflow: hidden; }
    .preset .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset .name .dirty { color: var(--accent); flex: none; }
    .tbtn {
      height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid #2a3038; background: #15191e; color: #aab2bd;
      font-size: 10px; font-weight: 800; letter-spacing: 0.14em; cursor: pointer; transition: var(--ease);
    }
    .tbtn:hover { color: #fff; border-color: rgba(255,152,54,0.6); }
    .tbtn.on { color: #1a0e02; background: linear-gradient(180deg, var(--accent-soft), var(--accent)); border-color: transparent; }
    .io { display: flex; align-items: center; gap: 14px; margin-left: 4px; }
    .io-k { display: flex; align-items: center; gap: 5px; }
    .io-k .meter { width: 6px; height: 36px; border-radius: 2px; background: #050608; position: relative; overflow: hidden; border: 1px solid #222830; }
    .io-k .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0;
                     background: linear-gradient(0deg, #3ddc84 0 62%, #ffd24a 80%, #ff4d4d 100%); background-size: 100% 36px; background-position: bottom; }
    .io-k .ctl .lab { color: #7d8590; font-size: 7.5px; }
    .io-k .ctl .val { font-size: 8px; padding: 0 3px; min-width: 0; }

    /* ── Rack bay ────────────────────────────────────── */
    .bay {
      flex: 1 1 auto; position: relative; margin: 10px 12px 0; border-radius: 10px 10px 0 0; overflow: hidden;
      background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0) 14px), repeating-linear-gradient(90deg, #0b0d10 0 2px, #0d1014 2px 4px);
      border: 1px solid #1d2229; border-bottom: 0; box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
    }
    .bay::before, .bay::after {
      content: ""; position: absolute; left: 0; right: 0; height: 11px; z-index: 0;
      background: repeating-linear-gradient(90deg, #2a2f36 0 16px, #121418 16px 19px, #2a2f36 19px 35px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.8);
    }
    .bay::before { top: 0; }
    .bay::after { bottom: 0; }
    .chain {
      position: absolute; inset: 0; padding: 16px 8px 16px; display: flex; align-items: stretch;
      overflow-x: auto; overflow-y: hidden; z-index: 1; scrollbar-width: thin; scrollbar-color: #2a3038 transparent;
    }
    .chain::-webkit-scrollbar { height: 7px; }
    .chain::-webkit-scrollbar-thumb { background: #2a3038; border-radius: 4px; }

    .ins { flex: 0 0 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .ins button {
      width: 18px; height: 18px; border-radius: 50%; border: 1px solid #39414c; background: #14181d; color: #8a93a0;
      font-size: 13px; line-height: 14px; padding: 0; cursor: pointer; opacity: 0.7; transition: var(--ease);
    }
    .ins button:hover { opacity: 1; color: #fff; border-color: var(--accent); background: #2a1a0b; }
    .ins.drop { background: rgba(255,152,54,0.25); box-shadow: inset 0 0 0 1px var(--accent); }

    /* ── Module ──────────────────────────────────────── */
    .mod {
      flex: 0 0 var(--mod-w); display: flex; flex-direction: column; border-radius: 6px; overflow: hidden;
      background: #0d0f12; border: 1px solid #000;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: opacity var(--ease), transform var(--ease);
    }
    .mod.dragging { opacity: 0.45; transform: scale(0.98); }
    .mhead {
      flex: 0 0 30px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 9px; cursor: grab;
      background: linear-gradient(180deg, #23272d, #191c21); border-bottom: 1px solid #000;
    }
    .led { width: 11px; height: 11px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; flex: none;
           background: radial-gradient(circle at 40% 35%, #b8ffcf, #2fd36b 45%, #0f6b33); box-shadow: 0 0 8px rgba(61,220,132,0.75); }
    .mod.bypassed .led { background: radial-gradient(circle at 40% 35%, #555, #2a2d31 60%); box-shadow: none; }
    .mhead .t { flex: 1; font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; color: #dfe3e8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mhead .fs { font-size: 8px; font-weight: 800; letter-spacing: 0.14em; color: #8b939e; border: 1px solid #343a43; background: #121519;
                 border-radius: 4px; padding: 4px 6px; cursor: pointer; }
    .mhead .fs:hover { color: #fff; border-color: var(--accent); }
    .mhead .x { width: 16px; height: 16px; border: 0; background: transparent; color: #5d6570; font-size: 11px; cursor: pointer; padding: 0; }
    .mhead .x:hover { color: #ff8a7a; }

    .plate {
      position: relative; flex: 1 1 auto; margin: 5px; border-radius: 5px; overflow: hidden;
      display: flex; flex-direction: column; align-items: stretch;
      background: var(--panel); color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 1px rgba(0,0,0,0.45);
    }
    .mod.bypassed .plate { filter: saturate(0.35) brightness(0.6); }
    .screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; z-index: 2;
      background: radial-gradient(circle at 35% 30%, #c9ced6, #6b727c 45%, #2b2f35); box-shadow: 0 0 0 1px rgba(0,0,0,0.55); }
    .screw::after { content: ""; position: absolute; left: 1.5px; right: 1.5px; top: 4px; height: 1px; background: rgba(0,0,0,0.6); transform: rotate(35deg); }
    .screw.tl { left: 6px; top: 6px; } .screw.tr { right: 6px; top: 6px; } .screw.bl { left: 6px; bottom: 6px; } .screw.br { right: 6px; bottom: 6px; }

    .badge { padding: 14px 16px 8px; text-align: center; position: relative; }
    .badge .n1 { font-family: var(--serif); font-size: 9.5px; font-weight: 700; letter-spacing: 0.3em; color: var(--ink-soft); }
    .badge .n2 { font-family: var(--brandfont, var(--serif)); font-size: 22px; font-weight: 900; letter-spacing: 0.04em; color: var(--brand); line-height: 1.05;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: var(--brandglow, none); }
    .badge .n3 { font-size: 7px; font-weight: 800; letter-spacing: 0.24em; color: var(--ink-soft); margin-top: 3px; text-transform: uppercase; }
    .badge.band { background: var(--band); border-bottom: 1px solid rgba(0,0,0,0.4); padding-bottom: 9px; margin-bottom: 4px; }

    .vu { margin: 2px 14px 4px; height: 72px; border-radius: 4px; position: relative; overflow: hidden; flex: none;
          background: radial-gradient(120% 140% at 50% 110%, #f6e7c1 0%, #efdcaa 55%, #d8c08a 100%);
          box-shadow: inset 0 0 0 2px #15120e, inset 0 0 0 4px #3a3226, inset 0 6px 14px rgba(0,0,0,0.35); }
    .vu.amber { background: radial-gradient(120% 140% at 50% 110%, #ffd88a 0%, #f2b24c 60%, #b8741f 100%); }
    .vu svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .vu.img { background-size: 100% 100%; background-position: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.5); }
    .vu.img svg { position: absolute; inset: 6% 6% 0; width: auto; height: auto; }
    .vu .vu-frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .vu-pair { margin: 2px 8px 4px; position: relative; flex: none; }
    .vu-pair img { display: block; width: 100%; }
    .vu-pair .pn { position: absolute; bottom: 16%; width: 1.4px; height: 46%; background: #1a1510; transform-origin: 50% 100%; transition: transform 90ms linear; }
    .vu-pair .pn.l { left: 27%; } .vu-pair .pn.r { left: 73%; }
    .tubes-img { margin: 0 12px 4px; flex: none; }
    .tubes-img img { display: block; width: 100%; border-radius: 3px; box-shadow: 0 0 14px rgba(255,140,40,0.25); }
    .mod.bypassed .tubes-img img { filter: brightness(0.35) saturate(0.3); box-shadow: none; }
    .iknob { position: relative; cursor: ns-resize; flex: none; }
    .iknob svg { position: absolute; inset: 0; pointer-events: none; }
    .iknob img { position: absolute; left: 9%; top: 9%; width: 82%; height: 82%; pointer-events: none; user-select: none;
                 filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6)); }
    .lcd { margin: 2px 14px 4px; height: 50px; border-radius: 4px; flex: none; background: #0a0f0c; box-shadow: inset 0 0 0 2px #000, inset 0 0 18px rgba(0,0,0,0.9);
           display: flex; align-items: center; justify-content: center; flex-direction: column; color: #ffb64a; font-family: Menlo, monospace; }
    .lcd .l1 { font-size: 8px; letter-spacing: 0.2em; opacity: 0.6; }
    .lcd .l2 { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-shadow: 0 0 8px rgba(255,182,74,0.5); }
    .scope { margin: 2px 12px 4px; height: 58px; border-radius: 5px; overflow: hidden; position: relative; flex: none;
             background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.25)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
    .scope svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tubes { margin: 0 18px 4px; height: 30px; display: flex; justify-content: space-around; align-items: flex-end; flex: none; }
    .tubes i { width: 16px; height: 26px; border-radius: 8px 8px 3px 3px; background: radial-gradient(60% 40% at 50% 70%, #ffb25c, #b45a12 55%, #2a1406);
               box-shadow: 0 0 12px rgba(255,150,60,0.55), inset 0 0 0 1px rgba(255,220,180,0.25); }
    .mod.bypassed .tubes i { box-shadow: none; background: #2a2018; }

    .controls { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr; align-content: space-evenly; justify-items: center; row-gap: 2px; padding: 0 8px; min-height: 0; }
    .ctl { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; width: 100%; }
    .ctl.hero { grid-column: 1 / span 2; }
    .ctl svg { display: block; cursor: ns-resize; overflow: visible; }
    .ctl .lab { font-size: 7.5px; font-weight: 800; letter-spacing: 0.13em; color: var(--label); text-transform: uppercase; text-align: center;
                max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; padding: 0 2px; }
    .ctl .lab:hover { color: var(--ink); }
    .ctl.hero .lab { font-size: 9px; letter-spacing: 0.2em; }
    .ctl .val { font-size: 8.5px; font-family: Menlo, monospace; color: var(--valc, #ffb64a); background: var(--valbg, rgba(0,0,0,0.6));
                border-radius: 3px; padding: 1px 5px; min-width: 36px; text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .tog { width: 18px; height: 30px; border-radius: 9px; position: relative; cursor: pointer; margin: 9px 0 3px;
           background: linear-gradient(180deg, #0c0d0f, #1d2024); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.12); }
    .tog i { position: absolute; left: 2px; width: 14px; height: 14px; border-radius: 50%; top: 14px; transition: top var(--ease);
             background: radial-gradient(circle at 40% 35%, #f2f4f7, #9aa1aa 55%, #5c626b); box-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .tog.on i { top: 2px; }
    .tog::after { content: ""; position: absolute; left: 50%; top: -7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #333; }
    .tog.on::after { background: #ff5a3c; box-shadow: 0 0 6px #ff5a3c; }

    .pfoot { display: flex; align-items: center; gap: 6px; padding: 4px 10px 12px; flex: none; }
    .ppick { flex: 1; min-width: 0; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.55); background: rgba(0,0,0,0.55); color: #e6e6e6;
             font-size: 10px; text-align: left; padding: 0 7px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
    .ppick:hover { border-color: var(--accent); }
    .pfoot .ctl { width: auto; flex-direction: row; gap: 4px; }
    .pfoot .ctl .lab { font-size: 7px; }

    .mod.missing .plate { background: repeating-linear-gradient(135deg, #1a1c20 0 8px, #16181b 8px 16px); }
    .missing-msg { margin: auto 16px; font-size: 11.5px; line-height: 1.5; text-align: center; color: #e9b3aa; }

    .blank {
      flex: 0 0 var(--mod-w); border-radius: 6px; position: relative; cursor: pointer;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px), linear-gradient(180deg, #15181c, #101215);
      border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #59616c;
      font-size: 10px; font-weight: 800; letter-spacing: 0.22em; transition: var(--ease);
    }
    .blank .plus { font-size: 30px; font-weight: 300; letter-spacing: 0; }
    .blank:hover { color: var(--accent-soft); border-color: rgba(255,152,54,0.5); }

    .statusbar { flex: 0 0 26px; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 9.5px; letter-spacing: 0.16em;
                 color: #6c7480; background: #0b0d10; border-top: 1px solid #000; }
    .statusbar .right { margin-left: auto; font-family: var(--serif); letter-spacing: 0.2em; }
    .scan { display: none; align-items: center; gap: 8px; }
    .scan.on { display: flex; }
    .scan .bar { width: 110px; height: 3px; border-radius: 2px; background: #1b2027; overflow: hidden; }
    .scan .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

    /* ── Browser overlay, menus, modals ─────────────── */
    .overlay { position: absolute; inset: 0; background: rgba(3,4,6,0.78); backdrop-filter: blur(4px); display: none; z-index: 50; }
    .overlay.open { display: block; }
    .browser { position: absolute; inset: 34px 44px; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
               background: linear-gradient(180deg, #171b21, #0f1216); border: 1px solid #2a3038; box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
    .bhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #000; background: #13161b; }
    .tabs { display: flex; padding: 3px; border-radius: 9px; background: #0b0e12; border: 1px solid #2a3038; }
    .tabs button { border: 0; background: transparent; color: #8a93a0; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; padding: 7px 11px; border-radius: 6px; cursor: pointer; }
    .tabs button.active { color: #1a0e02; background: linear-gradient(180deg, var(--accent-soft), var(--accent)); }
    .search { flex: 0 1 260px; background: #0b0e12; color: #eee; border: 1px solid #2a3038; border-radius: 7px; font-size: 13px; padding: 7px 10px; outline: none; }
    .search:focus { border-color: rgba(255,152,54,0.6); }
    .bhead .close { margin-left: auto; }
    .insert-note { font-size: 10px; color: var(--accent-soft); letter-spacing: 0.08em; }
    .bbody { flex: 1; overflow-y: auto; padding: 4px 16px 16px; scrollbar-width: thin; scrollbar-color: #2a3038 transparent; }
    .gtitle { font-size: 9.5px; font-weight: 800; letter-spacing: 0.22em; color: #7d8590; margin: 14px 2px 7px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 8px; }
    .cards.racks { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .card { position: relative; border-radius: 8px; padding: 10px 11px 9px 13px; cursor: pointer; transition: var(--ease);
            background: #12161b; border: 1px solid #252b33; min-height: 54px; overflow: hidden; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--accent)); }
    .card:hover { border-color: rgba(255,152,54,0.55); transform: translateY(-1px); }
    .card .c1 { font-family: var(--serif); font-size: 15px; font-weight: 800; }
    .card .c2 { font-size: 10.5px; color: #8a93a0; margin-top: 3px; line-height: 1.35; }
    .card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .card .chips span { font-size: 9px; letter-spacing: 0.06em; padding: 2px 5px; border-radius: 3px; background: #1c2128; color: #c4c9d0; }
    .card .chips span.missing { color: #ff8a7a; background: rgba(255,90,70,0.1); }
    .card .del { position: absolute; right: 7px; top: 7px; font-size: 11px; color: #8a93a0; opacity: 0; padding: 2px 5px; border-radius: 4px; }
    .card:hover .del { opacity: 1; }
    .card .del:hover { color: #ff8a7a; background: rgba(255,90,70,0.12); }
    .note { color: #8a93a0; font-size: 12px; padding: 22px 4px; line-height: 1.6; }

    .menu { position: absolute; z-index: 60; min-width: 210px; max-width: 300px; max-height: 360px; overflow-y: auto; padding: 5px;
            border-radius: 9px; background: #15191e; border: 1px solid #2f363f; box-shadow: 0 18px 40px rgba(0,0,0,0.7); display: none; }
    .menu.open { display: block; }
    .menu .mh { font-size: 8.5px; font-weight: 800; letter-spacing: 0.2em; color: #7d8590; padding: 8px 9px 3px; }
    .menu .mi { font-size: 12px; padding: 6px 9px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; }
    .menu .mi:hover { background: rgba(255,152,54,0.14); }
    .menu .mi.cur { color: var(--accent-soft); }
    .menu .mi .mx { margin-left: auto; color: #7d8590; }
    .menu .ms { height: 1px; background: #262c34; margin: 4px; }
    .modal-bg { position: absolute; inset: 0; z-index: 80; background: rgba(2,3,5,0.6); display: none; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { width: 350px; border-radius: 12px; padding: 18px; background: #15191e; border: 1px solid #2f363f; box-shadow: 0 30px 70px rgba(0,0,0,0.8); }
    .modal h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 18px; }
    .modal p { margin: 0 0 12px; font-size: 12px; color: #8a93a0; line-height: 1.5; }
    .modal input { width: 100%; background: #0b0e12; color: #eee; border: 1px solid #2a3038; border-radius: 7px; font-size: 14px; padding: 8px 10px; outline: none; }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .modal .err { color: #ff8a7a; font-size: 12px; margin-top: 7px; min-height: 14px; }
    .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 90; background: #1d232b; border: 1px solid rgba(255,152,54,0.4);
             border-radius: 8px; padding: 8px 13px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 250ms; max-width: 70%; }
    .toast.show { opacity: 1; }

    /* ── Nova Match ─────────────────────────────────────── */
    .match-btn.on { color: #0b0b10; background: linear-gradient(180deg, #b79bff, #9c7dff); box-shadow: 0 0 16px rgba(156,125,255,0.45); }
    .mv { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; z-index: 30; display: none;
          background: linear-gradient(180deg, #121417, #0d0f12); --pu: #9c7dff; --pu2: #b79bff; --pug: rgba(156,125,255,0.45);
          --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.16); --dim: #8b9099; --dimmer: #5b6069; --green: #5fe39a; --amber: #ffb86b; }
    .mv.open { display: block; }
    .mv-body { position: absolute; left: 20px; right: 20px; top: 16px; bottom: 150px; display: grid; grid-template-columns: 310px 1fr 340px; gap: 16px; }
    .mv-bottom { position: absolute; left: 20px; right: 20px; bottom: 16px; height: 120px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
    .mv-card { background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01)); border: 1px solid var(--line2); border-radius: 14px;
               padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .mv-h { font-size: 10px; font-weight: 800; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mv-h span { color: var(--dimmer); font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
    .mv-drop { border: 1px dashed var(--line2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.2); }
    .mv-drop.empty { align-items: center; justify-content: center; min-height: 118px; color: var(--dimmer); font-size: 12px; text-align: center; }
    .mv-fname { font-size: 13px; font-weight: 700; color: #eceef2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-meta { font-size: 10px; color: var(--dimmer); }
    .mv canvas { display: block; width: 100%; }
    .mv-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .mv-tag { font-size: 9px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 5px; background: rgba(95,227,154,0.12); color: var(--green); }
    .mv-btn { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line2); background: #22262b; color: var(--dim); font-size: 10px;
              font-weight: 800; letter-spacing: 0.12em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .mv-btn:hover { color: #fff; border-color: var(--pu); }
    .mv-btn.on, .mv-btn.primary { color: #0b0b10; background: linear-gradient(180deg, var(--pu2), var(--pu)); border-color: transparent; box-shadow: 0 0 14px var(--pug); }
    .mv-btn.rec.on { background: linear-gradient(180deg, #ff7b7b, #e04848); box-shadow: 0 0 14px rgba(224,72,72,0.5); }
    .mv-btn:disabled { opacity: 0.4; cursor: default; }
    .mv-row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .mv-score { align-items: center; justify-content: center; gap: 8px; }
    .mv-ring { width: 214px; height: 214px; position: relative; display: grid; place-items: center; }
    .mv-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .mv-big { font-size: 58px; font-weight: 800; line-height: 1; color: #f3f3f8; text-shadow: 0 0 26px var(--pug); text-align: center; }
    .mv-big small { font-size: 22px; color: var(--dim); }
    .mv-sub { font-size: 10px; letter-spacing: 0.2em; color: var(--dimmer); text-transform: uppercase; text-align: center; }
    .mv-before { font-size: 12px; color: var(--dim); text-align: center; } .mv-before b { color: #eceef2; }
    .mv-ab { display: flex; gap: 3px; padding: 3px; border-radius: 9px; border: 1px solid var(--line2); background: #1b1e22; }
    .mv-ab button { height: 28px; padding: 0 13px; border-radius: 6px; border: none; background: transparent; color: var(--dim); font-size: 10px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer; }
    .mv-ab button:hover { color: #fff; }
    .mv-ab button.on { background: rgba(156,125,255,0.22); color: var(--pu2); }
    .mv-ab button:disabled { opacity: 0.35; cursor: default; }
    .mv-slider { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; }
    .mv-slider input { width: 100%; accent-color: #9c7dff; }
    .mv-stage { display: grid; grid-template-columns: 112px 1fr 38px 22px; align-items: center; gap: 8px; font-size: 11px; }
    .mv-stage .n { color: #eceef2; font-weight: 700; } .mv-stage .p { color: var(--dimmer); font-size: 9px; letter-spacing: 0.03em; }
    .mv-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
    .mv-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width 400ms ease; }
    .mv-bar b { position: absolute; top: -1px; bottom: -1px; width: 2px; background: rgba(255,255,255,0.35); }
    .mv-pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
    .mv-lock { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--dimmer); font-size: 10px; cursor: pointer; display: grid; place-items: center; padding: 0; }
    .mv-lock.on { border-color: var(--amber); color: var(--amber); }
    .mv-chain { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .mv-mod { height: 60px; min-width: 104px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line2); background: linear-gradient(180deg, #262a30, #1a1d21);
              display: flex; flex-direction: column; justify-content: space-between; }
    .mv-mod .t { font-size: 9px; letter-spacing: 0.14em; color: var(--dimmer); font-weight: 800; }
    .mv-mod .v { font-size: 11px; font-weight: 700; color: #eceef2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .mv-arrow { color: var(--dimmer); font-size: 12px; }
    .mv-notes { font-size: 11px; color: var(--dim); line-height: 1.5; overflow: hidden; }
    .mv-legend { display: flex; gap: 12px; font-size: 9px; letter-spacing: 0.1em; color: var(--dimmer); text-transform: uppercase; }
    .mv-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 2px; margin-right: 5px; }
    .mv-progress { width: 100%; max-width: 380px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .mv-progress i { display: block; height: 100%; background: linear-gradient(90deg, #9c7dff, #4ea9ff); transition: width 300ms ease; }
    .mv-status { font-size: 11px; color: var(--dim); text-align: center; min-height: 15px; }
    .mv-err { color: #ff8a7a; }
    .mv-empty-chain { font-size: 11px; color: var(--dimmer); }
  </style>
</head>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="g-dark" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#4a4f57"/><stop offset="0.55" stop-color="#1d2025"/><stop offset="1" stop-color="#08090b"/></radialGradient>
    <radialGradient id="g-gloss" cx="42%" cy="25%" r="80%"><stop offset="0" stop-color="#62666d"/><stop offset="0.35" stop-color="#16181c"/><stop offset="1" stop-color="#020203"/></radialGradient>
    <radialGradient id="g-red" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#e4625a"/><stop offset="0.5" stop-color="#8e1f1d"/><stop offset="1" stop-color="#3a0909"/></radialGradient>
    <radialGradient id="g-blue" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#7fa9e6"/><stop offset="0.5" stop-color="#284f8e"/><stop offset="1" stop-color="#0e1f3d"/></radialGradient>
    <radialGradient id="g-green" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#9fe0a0"/><stop offset="0.5" stop-color="#2f7a3f"/><stop offset="1" stop-color="#0f2d16"/></radialGradient>
    <radialGradient id="g-brown" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#d6a173"/><stop offset="0.5" stop-color="#7a4a26"/><stop offset="1" stop-color="#2e1a0b"/></radialGradient>
    <radialGradient id="g-cream" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#fff6de"/><stop offset="0.55" stop-color="#cdbb92"/><stop offset="1" stop-color="#6d5f43"/></radialGradient>
    <radialGradient id="g-chrome" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#b7bec8"/><stop offset="1" stop-color="#4c535d"/></radialGradient>
    <radialGradient id="g-navy" cx="42%" cy="28%" r="78%"><stop offset="0" stop-color="#3b4b66"/><stop offset="0.6" stop-color="#151d2c"/><stop offset="1" stop-color="#070a10"/></radialGradient>
  </defs></svg>

  <div class="app" id="app">
    <div class="topbar">
      <button class="hamb" id="openBrowser" title="Plugins and presets">&#9776;</button>
      <div class="brand"><img src="n_logo.png" alt="" /><b>NOVA</b><span>RACK</span></div>
      <div class="preset">
        <button id="prevRack" title="Previous rack">&#9664;</button>
        <div class="name" id="rackName"><span id="rackNameText">New Rack</span><span class="dirty" id="dirty"></span></div>
        <button id="nextRack" title="Next rack">&#9654;</button>
        <button id="rackMenu" title="Save, save as, new">&#8943;</button>
      </div>
      <button class="tbtn match-btn" id="matchBtn" title="Nova Match: rebuild a reference vocal's sound with this rack">&#10022; MATCH</button>
      <button class="tbtn" id="bypassAll" title="Bypass every unit">BYPASS ALL</button>
      <div class="io" id="io"></div>
    </div>

    <div class="bay"><div class="chain" id="chain"></div></div>

    <div class="mv" id="matchView"></div>

      <span id="unitCount">0 / 8 UNITS</span>
      <span id="latency"></span>
      <span class="scan" id="scan"><span id="scanText">SCANNING</span><span class="bar"><i id="scanBar"></i></span></span>
      <span class="right">NOVA AUDIO · ONE RACK, EVERY NOVA</span>
    </div>

    <div class="overlay" id="overlay">
      <div class="browser">
        <div class="bhead">
          <div class="tabs" id="tabs">
            <button data-tab="plugins" class="active">PLUGINS</button>
            <button data-tab="racks">RACK PRESETS</button>
            <button data-tab="modules">MY MODULE PRESETS</button>
          </div>

          <button class="tbtn" id="rescan" title="Look for newly installed Nova plugins">RESCAN</button>
          <button class="tbtn close" id="closeBrowser">CLOSE</button>
        </div>
        <div class="bbody" id="browserBody"></div>
      </div>
    </div>

    <div class="menu" id="menu"></div>

    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3 id="modalTitle">Save</h3>
        <p id="modalText"></p>
        <input id="modalInput" spellcheck="false" />
        <div class="err" id="modalErr"></div>
        <div class="row"><button class="tbtn" id="modalCancel">CANCEL</button><button class="tbtn on" id="modalOk">SAVE</button></div>
      </div>
    </div>

    <div class="modal-bg" id="licenseBg">
      <div class="modal">
