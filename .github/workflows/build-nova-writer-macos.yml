name: Build Nova Writer macOS
run-name: Nova Writer macOS | ${{ github.event_name }} | ${{ github.sha }}

on:
  push:
    paths:
      - 'Nova Writer/**'
      - '.github/workflows/build-nova-writer-macos.yml'
  pull_request:
    paths:
      - 'Nova Writer/**'
      - '.github/workflows/build-nova-writer-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Nova Writer
        run: npm install

      - name: Build Nova Writer.app
        working-directory: Nova Writer
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package app as zip
        run: |
          cd "Nova Writer/dist"
          APP=$(find . -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "NovaWriter-macOS.zip"
          else
            # electron-builder already creates zip artifacts
            echo "App bundle packaged by electron-builder"
          fi

      - name: Upload Nova Writer.app
        uses: actions/upload-artifact@v4
        with:
          name: NovaWriter-macOS
          path: |
            Nova Writer/dist/*.zip
            Nova Writer/dist/mac*/*.app
