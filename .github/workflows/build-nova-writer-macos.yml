name: Build Nova Writer macOS
run-name: Nova Writer macOS | ${{ github.event_name }} | ${{ github.sha }}

on:
  push:
    paths:
      - 'Nova Writer/**'
      - '.github/workflows/build-nova-writer-macos.yml'
  pull_request:
    paths:
      - 'Nova Writer/**'
      - '.github/workflows/build-nova-writer-macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Nova Writer
        run: npm install

      - name: Build Nova Writer.app
        working-directory: Nova Writer
        run: npm run build:mac || true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify build output
        run: ls "Nova Writer/dist/"

      - name: Upload Nova Writer.app
        uses: actions/upload-artifact@v4
        with:
          name: NovaWriter-macOS
          path: Nova Writer/dist/*.zip
