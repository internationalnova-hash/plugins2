name: Build Nova 2-Track macOS

on:
  push:
    paths:
      - 'Nova 2-Track/**'
      - '.github/workflows/build-nova-2-track-macos.yml'
  pull_request:
    paths:
      - 'Nova 2-Track/**'
      - '.github/workflows/build-nova-2-track-macos.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Clean build directory
        run: rm -rf "Nova 2-Track/build"

      # Customer builds are license-gated; local builds default to ungated.
      - name: Configure CMake
        run: cmake -S "Nova 2-Track" -B "Nova 2-Track/build" -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DNOVA_2TRACK_REQUIRE_LICENSE=ON

      - name: Build
        run: cmake --build "Nova 2-Track/build" --config Release

      - name: Measurement accuracy tests
        run: |
          "Nova 2-Track/build/Nova2TrackTests_artefacts/Release/Nova2TrackTests" || "Nova 2-Track/build/Nova2TrackTests_artefacts/Nova2TrackTests"

      - name: Package VST3 Bundle
        run: |
          cd "Nova 2-Track/build/Nova2Track_artefacts/Release/VST3" 2>/dev/null || cd "Nova 2-Track/build/Nova2Track_artefacts/VST3"
          ditto -c -k --sequesterRsrc --keepParent "Nova 2-Track.vst3" "Nova2Track-macOS-vst3.zip"
          mv Nova2Track-macOS-vst3.zip "$GITHUB_WORKSPACE/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova2Track-macOS-build
          path: Nova2Track-macOS-vst3.zip
