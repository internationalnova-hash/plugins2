name: Build Nova Loop Lab Windows

on:
  push:
    paths:
      - 'Nova Loop Lab/**'
      - '.github/workflows/build-nova-loop-lab-windows.yml'
  pull_request:
    paths:
      - 'Nova Loop Lab/**'
      - '.github/workflows/build-nova-loop-lab-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.1

      - name: Clean build directory
        run: if (Test-Path "Nova Loop Lab/build") { Remove-Item -Recurse -Force "Nova Loop Lab/build" }

      # Customer builds are license-gated; local builds default to ungated.
      - name: Configure CMake
        run: cmake -S "Nova Loop Lab" -B "Nova Loop Lab/build" -DNOVA_LOOPLAB_REQUIRE_LICENSE=ON

      - name: Build
        run: cmake --build "Nova Loop Lab/build" --config Release

      - name: Measurement accuracy tests
        run: '& "Nova Loop Lab/build/NovaLoopLabTests_artefacts/Release/NovaLoopLabTests.exe"'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaLoopLab-Windows-build
          path: Nova Loop Lab/build/NovaLoopLab_artefacts
