name: Build Nova Mid Windows

on:
  push:
    paths:
      - 'Nova Mid/**'
      - '.github/workflows/build-nova-mid-windows.yml'
  pull_request:
    paths:
      - 'Nova Mid/**'
      - '.github/workflows/build-nova-mid-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.1

      - name: Clean build directory
        run: if (Test-Path "Nova Mid/build") { Remove-Item -Recurse -Force "Nova Mid/build" }

      # Customer builds are license-gated; local builds default to ungated.
      - name: Configure CMake
        run: cmake -S "Nova Mid" -B "Nova Mid/build" -DNOVA_MID_REQUIRE_LICENSE=ON

      - name: Build
        run: cmake --build "Nova Mid/build" --config Release

      - name: Measurement accuracy tests
        run: '& "Nova Mid/build/NovaMidTests_artefacts/Release/NovaMidTests.exe"'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaMid-Windows-build
          path: Nova Mid/build/NovaMid_artefacts
