name: Build Nova Rack macOS

on:
  push:
    paths:
      - 'Nova Rack/**'
      - '.github/workflows/build-nova-rack-macos.yml'
  pull_request:
    paths:
      - 'Nova Rack/**'
      - '.github/workflows/build-nova-rack-macos.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Clean build directory
        run: rm -rf "Nova Rack/build"

      # Customer builds are license-gated; local builds default to ungated.
      - name: Configure CMake
        run: cmake -S "Nova Rack" -B "Nova Rack/build" -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DNOVA_RACK_REQUIRE_LICENSE=ON

      - name: Build
        run: cmake --build "Nova Rack/build" --config Release

      - name: Measurement accuracy tests
        run: |
          "Nova Rack/build/NovaRackTests_artefacts/Release/NovaRackTests" || "Nova Rack/build/NovaRackTests_artefacts/NovaRackTests"

      - name: Package VST3 Bundle
        run: |
          cd "Nova Rack/build/NovaRack_artefacts/Release/VST3" 2>/dev/null || cd "Nova Rack/build/NovaRack_artefacts/VST3"
          ditto -c -k --sequesterRsrc --keepParent "Nova Rack.vst3" "NovaRack-macOS-vst3.zip"
          mv NovaRack-macOS-vst3.zip "$GITHUB_WORKSPACE/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaRack-macOS-build
          path: NovaRack-macOS-vst3.zip
