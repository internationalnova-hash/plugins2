name: Build Nova Mid macOS

on:
  push:
    paths:
      - 'Nova Mid/**'
      - '.github/workflows/build-nova-mid-macos.yml'
  pull_request:
    paths:
      - 'Nova Mid/**'
      - '.github/workflows/build-nova-mid-macos.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Clean build directory
        run: rm -rf "Nova Mid/build"

      # Customer builds are license-gated; local builds default to ungated.
      - name: Configure CMake
        run: cmake -S "Nova Mid" -B "Nova Mid/build" -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DNOVA_MID_REQUIRE_LICENSE=ON

      - name: Build
        run: cmake --build "Nova Mid/build" --config Release

      - name: Measurement accuracy tests
        run: |
          "Nova Mid/build/NovaMidTests_artefacts/Release/NovaMidTests" || "Nova Mid/build/NovaMidTests_artefacts/NovaMidTests"

      - name: Package VST3 Bundle
        run: |
          cd "Nova Mid/build/NovaMid_artefacts/Release/VST3" 2>/dev/null || cd "Nova Mid/build/NovaMid_artefacts/VST3"
          ditto -c -k --sequesterRsrc --keepParent "Nova Mid.vst3" "NovaMid-macOS-vst3.zip"
          mv NovaMid-macOS-vst3.zip "$GITHUB_WORKSPACE/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaMid-macOS-build
          path: NovaMid-macOS-vst3.zip
